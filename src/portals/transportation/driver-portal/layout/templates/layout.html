<header class="app-header theme box-shadow-6">
    <div class="navbar navbar-expand-lg">
        <div class="collapse navbar-collapse order-lg-1" id="navbarToggler">
            <ul class="navbar-nav mt-lg-0 mx-0 mx-lg-2 nav-active-border b-primary top">
                <ng-template let-nav ngFor let-item [ngForOf]="navData" let-i="index">
                    <ng-container *ngIf="nav?.isFLatChildren">
                        <li class="nav-item" *ngFor="let item of nav?.children">
                            <a class="nav-link" [routerLink]="item.routeTo" routerLinkActive="active">
                                <span>{{ item?.name }}</span>
                            </a>
                        </li>
                    </ng-container>
                    <ng-container *ngIf="!nav?.isFLatChildren">
                        <li class="nav-item dropdown">
                            <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">{{nav?.name}}
                            </a>
                            <div class="dropdown-menu mt-2 w pt-2 mt-2 animate fadeIn">
                                <a [routerLink]="item.routeTo" routerLinkActive="active" class="dropdown-item"
                                   *ngFor="let item of nav?.children">
                                    {{ item?.name }}
                                </a>
                            </div>
                        </li>
                    </ng-container>
                </ng-template>
            </ul>
            <!--<form class="input-group m-2 my-lg-0">
                              <span class="input-group-btn">
                                  <button type="button" class="btn no-border no-bg no-shadow"><i class="fa fa-search"></i></button>
                              </span>
              <input type="text" class="form-control no-border no-bg no-shadow" placeholder="Search projects...">
            </form>-->
        </div>
        <ul class="nav flex-row order-lg-2">
            <li class="d-lg-none d-flex align-items-center">
                <a href="#" class="mx-2" data-toggle="collapse" data-target="#navbarToggler" data-pjax-state="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
                        <path d="M64 144h384v32H64zM64 240h384v32H64zM64 336h384v32H64z"></path>
                    </svg>
                </a>
            </li>
        </ul>
    </div>
</header>
<div class="app" id="app">
    <div id="content" class="app-content box-shadow-3" role="main">
        <div class="hide">
            <div class="content-header" id="content-header"></div>
        </div>
        <!--<div class="p-2">
          <breadcrumb></breadcrumb>
        </div>-->
        <div class="content-main d-flex flex" id="content-main">
            <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
    </div>
</div>
