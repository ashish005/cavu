<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <div class="navbar flex-nowrap">
            <a class="no-shadow">
                <h6 class="mb-0">{{pageTitle}}</h6>
                <small class="float-left pl-4">Manage</small>
            </a>
            <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
        </div>
        <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
            <org-grid [data]="gridData"
                      [options]="gridOptions"
                      [isLoading] = "isLoading"
                      (cb)="actionCb($event)"
                      (update)="updateGrid($event)"
                      (cbRemove)="actionRemoveCb($event)"></org-grid>
            <div class="no-result" *ngIf="!isLoading && !gridData?.length">
                <div class="p-4 text-center">No Result Found. </div>
            </div>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total" [perPage]="gridOptions?.take" [page]="gridOptions?.page"
                                 (cb)="moveToPage($event)"></org-grid-pagination>
        </div>
    </div>
</div>
<ng-template #actionTemplate></ng-template>
