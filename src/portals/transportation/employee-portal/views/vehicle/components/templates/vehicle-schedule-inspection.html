<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <form [formGroup]="customForm" class="p-3">
            <div class="row row-sm">
                <div class="col-sm-6">
                    <div class="md-form-group">
                        <div class="md-input disabled">{{ customForm.get('vehicleNo').value }}</div>
                        <label> Vehicle No </label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="md-form-group">
                        <input type="date" class="md-input" formControlName="dueDate" style="height: 20px;">
                        <label>Due Date</label>
                    </div>
                </div>
            </div>
            <div class="row row-sm">
                <div class="col-sm-12">
                    <div>
                        <h6 class="pb-0">Inspection Details</h6>
                    </div>
                    <table class="table small-table text-xs">
                        <thead>
                        <tr>
                            <th>Head</th>
                            <!--<th>Amount</th>-->
                            <!--<th>Status</th>-->
                            <th>Certificate*</th>
                            <th>Active</th>
                        </tr>
                        </thead>
                        <tbody formArrayName="heads">
                        <ng-template ngFor let-detail [ngForOf]="formInspectionHeads.controls" let-i="index">
                            <tr [formGroup]="detail">
                                <td>
                                    {{detail.value.inspectionHeadName}}
                                </td>
                                <!--<td>
                                    <div class="md-form-group p-1">
                                        <input type="number" class="md-input" formControlName="amount" style="height: 20px;">
                                    </div>
                                </td>-->
                                <!--<td>
                                    <select class="md-input" formControlName="serviceStatus" style="width: 70px">
                                        <option *ngFor="let entity of apiResolver.masterType?.serviceStatuses;" [ngValue]="entity.id"> {{entity.name}}</option>
                                    </select>
                                </td>-->
                                <td>
                                    <div class="text-center">
                                        <i class="fa fa-check text-success" *ngIf="detail.value.certificateRequired"></i>
                                        <i class="fa fa-close text-danger" *ngIf="!detail.value.certificateRequired"></i>
                                    </div>
                                </td>
                                <td><label class="md-check"><input type="checkbox" formControlName="isActive"><i class="success"></i><span></span></label></td>
                            </tr>
                        </ng-template>
                        </tbody>
                    </table>
                </div>
            </div>
            <ng-template #footerTemplate>
                <div class="row">
                    <div class="col-sm-12 text-center">
                        <button (click)="onSubmit(customForm)" class="btn btn-sm primary m-2"
                                [disabled]="!customForm.valid || submitted">
                            <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
                            {{ submitted ? 'Submitting...' : 'Schedule' }}
                        </button>
                    </div>
                </div>
            </ng-template>
        </form>
    </div>
    <div class="d-flex flex-column flex">
        <schedule-history [vehicleId]="id"></schedule-history>
    </div>
</div>
