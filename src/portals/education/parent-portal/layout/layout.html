<div class="app" id="app">
  <div id="aside" class="app-aside fade nav-expand">
    <div class="sidenav modal-dialog dk">
      <div class="navbar lt white">
        <a [routerLink]="['/']" class="navbar-brand">
          <svg height="28" width="28" version="1.1" id="L1" xmlns="http://www.w3.org/2000/svg"  x="0px" y="0px" viewBox="0 0 100 100" enable-background="new 0 0 100 100" xml:space="preserve">
              <circle fill="none" stroke="#fff" stroke-width="6" stroke-miterlimit="15" stroke-dasharray="14.2472,14.2472" cx="50" cy="50" r="47" transform="rotate(53.0186 50 50)">
                <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="5s" from="0 50 50" to="360 50 50" repeatCount="indefinite"></animateTransform>
              </circle>
              <circle fill="none" stroke="#fff" stroke-width="1" stroke-miterlimit="10" stroke-dasharray="10,10" cx="50" cy="50" r="39" transform="rotate(-53.0186 50 50)">
                  <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="5s" from="0 50 50" to="-360 50 50" repeatCount="indefinite"></animateTransform>
              </circle>
              <g fill="#fff">
                <rect x="30" y="35" width="5" height="30" transform="translate(0 -2.2726)">
                  <animateTransform attributeName="transform" dur="1s" type="translate" values="0 5 ; 0 -5; 0 5" repeatCount="indefinite" begin="0.1"></animateTransform>
                </rect>
                <rect x="40" y="35" width="5" height="30" transform="translate(0 -4.2726)">
                  <animateTransform attributeName="transform" dur="1s" type="translate" values="0 5 ; 0 -5; 0 5" repeatCount="indefinite" begin="0.2"></animateTransform>
                </rect>
                <rect x="50" y="35" width="5" height="30" transform="translate(0 -3.7274)">
                  <animateTransform attributeName="transform" dur="1s" type="translate" values="0 5 ; 0 -5; 0 5" repeatCount="indefinite" begin="0.3"></animateTransform>
                </rect>
                <rect x="60" y="35" width="5" height="30" transform="translate(0 -1.7274)">
                  <animateTransform attributeName="transform" dur="1s" type="translate" values="0 5 ; 0 -5; 0 5" repeatCount="indefinite" begin="0.4"></animateTransform>
                </rect>
                <rect x="70" y="35" width="5" height="30" transform="translate(0 0.2726)">
                  <animateTransform attributeName="transform" dur="1s" type="translate" values="0 5 ; 0 -5; 0 5" repeatCount="indefinite" begin="0.5"></animateTransform>
                </rect>
              </g>
          </svg>
          <!--<img src="../assets/images/logo.png" alt="." class="hide">-->
          <span class="hidden-folded d-inline">EnRator</span>
        </a>
      </div>
      <div class="flex hide-scroll">
        <div class="scroll">
          <div class="py-3 light lt" style="background-size:cover">
            <div class="nav-fold px-2">
              <a class="d-flex p-2"><span class="avatar w-40 rounded grey hide">J</span> <img class="w-40 circle"></a>
              <div class="hidden-folded flex p-2">
                <div class="d-flex">
                  <a class="mr-auto text-nowrap">{{userName}}
                    <small class="d-block text-muted">{{coreService?.currentUser?.userType}}</small>
                  </a>
                </div>
              </div>
            </div>
          </div>
          <div class="nav-active-theme">
            <ul class="nav bg">
              <li class="active"><a [routerLink]="['dashboard']"><span class="nav-icon"><i class="fa fa-dashboard"></i></span>
                <span class="nav-text">Dashboard</span></a></li>
              <li class="pb-2 hidden-folded"></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="no-shrink lt">
        <div class="nav-fold">
          <a class="d-flex p-2-3" data-toggle="dropdown"><span class="avatar w-28 grey hide">J</span><i
                  class="fa fa-user"></i></a>
          <div class="dropdown-menu w pt-0 mt-2 animate fadeIn">
            <a class="dropdown-item" (click)="logout()">Sign out</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="content" class="app-content box-shadow-4 box-radius-4" role="main">
    <div class="content-header white box-shadow-4" id="content-header">
      <div class="navbar navbar-expand-lg">
        <a class="d-lg-none mx-2" data-toggle="modal" data-target="#aside">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
            <path d="M80 304h352v16H80zM80 248h352v16H80zM80 192h352v16H80z"></path>
          </svg>
        </a>
        <div class="flex">
          <breadcrumb></breadcrumb>
        </div>
        <ul class="nav flex-row order-lg-2">
          <li class="dropdown d-flex align-items-center">
            <a data-toggle="dropdown" class="d-flex align-items-center">
              <span class="avatar w-30 grey hide"></span><i class="fa fa-user"></i>
            </a>
            <div class="dropdown-menu dropdown-menu-right w pt-0 mt-2 animate fadeIn">
              <a class="dropdown-item" [routerLink]="['profile']"><span>Profile</span></a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" (click)="logout()">Sign out</a>
            </div>
          </li>
          <li class="d-lg-none d-flex align-items-center">
            <a href="#" class="mx-2" data-toggle="collapse" data-target="#navbarToggler" data-pjax-state="">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
                <path d="M64 144h384v32H64zM64 240h384v32H64zM64 336h384v32H64z"></path>
              </svg>
            </a>
          </li>
        </ul>
        <div class="collapse navbar-collapse no-grow order-lg-1" id="navbarToggler">
          <form class="input-group m-2 my-lg-0">
            <span class="input-group-btn"><button type="button" class="btn no-border no-bg no-shadow"><i
                    class="fa fa-search"></i></button></span>
            <input type="text" class="form-control no-border no-bg no-shadow" placeholder="Search projects...">
          </form>
        </div>
      </div>
    </div>
    <div class="content-main d-flex flex">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
