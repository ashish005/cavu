<header class="org-header theme flex-nowrap box-shadow">
  <org-header></org-header>
</header>
<div class="app" id="app">
    <org-aside showInbox="true" [data]="navList"></org-aside>
    <div id="content" class="app-content box-shadow-0" role="main">
        <div class="content-header white box-shadow" id="content-header">
            <!--d-lg-none-->
            <div class="navbar navbar-expand-lg">
                <a class="d-lg-none mx-2" data-toggle="modal" data-target="#aside">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
                        <path d="M80 304h352v16H80zM80 248h352v16H80zM80 192h352v16H80z"></path>
                    </svg>
                </a>
                <div class="navbar-text nav-title flex" id="pageTitle"></div>
              <ul class="nav flex-row order-lg-2">
                <li class="d-lg-none d-flex align-items-center">
                    <a href="#" class="mx-2" data-toggle="collapse" data-target="#navbarToggler" data-pjax-state="">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
                            <path d="M64 144h384v32H64zM64 240h384v32H64zM64 336h384v32H64z"></path>
                        </svg>
                    </a>
                </li>
              </ul>
              <div class="collapse navbar-collapse no-grow order-lg-1" id="navbarToggler">
                  <form class="input-group m-2 my-lg-0"><span class="input-group-btn"><button type="button"
                                                                                              class="btn no-border no-bg no-shadow"><i
                          class="fa fa-search"></i></button> </span><input type="text"
                                                                           class="form-control no-border no-bg no-shadow"
                                                                           placeholder="Search projects..."></form>
              </div>
            </div>
        </div>
        <div class="p-2">
            <app-breadcrumb></app-breadcrumb>
        </div>
        <div class="content-main d-flex flex" id="content-main">
            <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
    </div>
</div>
<ng-template #navbarRightTemplate>
    <li class="nav-item dropdown d-flex align-items-center px-2">
        <button class="btn btn-sm btn-outline border text-theme b-theme dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
            <span class="hidden-folded d-inline">External</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-right" x-placement="bottom-start">
            <li class="dropdown-item">
                <a href="https://www.google.com" target="_blank">Google</a>
            </li>
        </ul>
    </li>
    <li class="nav-item dropdown d-flex align-items-center px-2">
        <button class="btn btn-sm btn-outline border text-theme b-theme dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
            <span class="hidden-folded d-inline">Session & Batch</span>
        </button>
        <ul class="dropdown-menu animate fadeIn" x-placement="bottom-start">
            <li class="dropdown-item">
                <a [routerLink]="['session']" class="d-block">
                    <small class="d-block _500 title">Session & Batch</small>
                </a>
            </li>
        </ul>
    </li>
</ng-template>
