<form class="content-main d-flex flex" [formGroup]="customForm">
    <div class="d-flex flex-column flex p-3">
        <table class="table small-table text-xs table-borderless">
            <thead>
            <tr>
                <th style="width: 40px;"></th>
                <th><span class="pl-2">Name</span></th>
                <th style="width: 80px;"><span class="px-1">Code</span></th>
            </tr>
            </thead>
            <tbody formArrayName="subjects" class="scroll-y h-100 px-3">
            <ng-template ngFor let-subject [ngForOf]="subjectForm.controls" let-i="index">
                <tr  [formGroupName]="i">
                    <td>
                        <button type="button" class="btn btn-xs btn-icon" (click)="removeSubject(i)"><i class="fa fa-minus"></i></button>
                    </td>
                    <td><input class="md-input" type="text" formControlName="name"></td>
                    <td><input class="md-input" type="text" formControlName="code"></td>
                </tr>
            </ng-template>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="2">
                    <button type="button" class="btn btn-xs btn-outline b-a" (click)="addSubject()"><i class="fa fa-plus"></i></button>
                </td>
                <td>
                    <button type="button" class="btn btn-xs btn-outline b-a" (click)="submitForm()">Save</button>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
</form>
