<div class="d-flex flex">
  <form class="d-flex flex-column flex p-3" [formGroup]="customForm">
    <div class="row row-sm">
      <div class="col-sm-12">
        <select-dropdown [items]="apiResolver?.masterType?.studyMode" title="Study Mode" (cb)="updateStudyMode($event)"
                         [control]="formStudyMode"></select-dropdown>
      </div>
      <div class="col-sm-12">
        <div class="md-form-group">
          <input type="date" class="md-input" formControlName="startDate"
                 [ngClass]="{ 'is-invalid': submitted && f['startDate'].errors }">
          <label> Start Date </label>
        </div>
      </div>
      <div class="col-sm-12">
        <div class="md-form-group">
          <input class="md-input" formControlName="name" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
          <label> Name </label>
        </div>
      </div>
    </div>
    <ng-template #footerTemplate>
      <div class="row row-sm">
        <div class="col-sm-12 text-center">
          <button type="submit" class="btn btn-sm primary" [disabled]="!customForm.valid || submitted"  (click)="onSubmit(customForm)">
            <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
            {{ submitted ? 'Submitting...' : actionType }}
          </button>
        </div>
      </div>
    </ng-template>
  </form>
</div>
