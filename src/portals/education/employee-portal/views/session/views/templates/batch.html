<div class="d-flex flex">
  <div class="d-flex flex-column flex">
    <div class="navbar flex-nowrap">
      <div class="navbar-text flex p-0"></div>
      <ul class="nav nav-xs flex-row no-border text-xs">
      <li class="nav-item">
        <a (click)="showFeeTypesMasterPopup()" class="btn btn-sm btn-outline text-theme b-theme">
          <i class="fa fa-fw fa-magic"></i> Fee Types
        </a>
      </li>
      <li class="nav-item">
        <a (click)="showConcessionFeeMasterPopup()" class="btn btn-sm btn-outline text-theme b-theme">
          <i class="fa fa-fw fa-magic"></i> Concessions
        </a>
      </li>
      <li class="nav-item">
        <a (click)="showFeePenaltyMasterPopup()" class="btn btn-sm btn-outline text-theme b-theme">
          <i class="fa fa-fw fa-magic"></i> Fee Penalty
        </a>
      </li>
    </ul>
    </div>
    <div class="navbar flex-nowrap box-shadow">
      <div class="navbar-text flex p-0">
        <h6 class="mb-0"> Org Batch & Session </h6>
        <small class="float-left">Management</small>
      </div>
      <ul class="nav nav-xs flex-row no-border">
        <li class="nav-item">
          <a class="ml-auto btn btn-outline b-a btn-sm b-theme" (click)="refreshGrid()"><i class="fa fa-refresh"></i></a>
        </li>
      </ul>
    </div>
    <div class="scrollable hover h-100">
      <org-grid [data]="gridData"
                [options]="gridOptions"
                (cb)="updateBatch($event)"
                (update)="updateGrid($event)">
      </org-grid>
    </div>
    <div class="mt-auto">
      <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take"
                           [page]="coreState?.page" (cb)="moveToPage($event)">
      </org-grid-pagination>
    </div>
  </div>
</div>
