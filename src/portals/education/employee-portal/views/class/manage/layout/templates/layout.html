<div id="content" class="app-content box-shadow-0" role="main">
  <div class="navbar flex-nowrap lt">
    <a data-toggle="modal" data-target="#content-aside" data-pjax-state="" class="mr-1 d-md-none">
      <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
    </a>
    <div class="no-shadow">
      <h6 class="mb-0"> Class </h6>
      <small class="float-left"> Management</small>
    </div>
  </div>
  <div class="content-main d-flex flex">
    <div class="fade aside aside-sm" id="content-aside">
      <div class="modal-dialog d-flex flex-column w-xxl light">
        <ng-container *ngIf="actionTemplate">
          <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
        </ng-container>
        <div class="p-2">
          <span class="text-muted text-sm">Study Modes</span>
          <a class="text-primary text-theme item-title _500 float-right" (click)="showAllModes($event)">Show all </a>
        </div>
        <div class="scrollable hover">
          <div class="list-group list-group-gap p-2">
            <ng-template ngFor let-row [ngForOf]="apiResolver.masterType?.studyMode | sortBy:'asc': 'sortOrder'" let-i="index">
              <div class="list-group-item p-1 px-2 box">
                <a class="float-right btn btn-xs btn-icon" (click)="onStudyModeChange(row)"><i class="fa fa-chevron-right"></i></a>
                <a class="item-title _500" data-pjax-state="">{{ row.name}}</a>
              </div>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex flex">
      <router-outlet (activate)='onActivate($event)'></router-outlet>
    </div>
  </div>
</div>
