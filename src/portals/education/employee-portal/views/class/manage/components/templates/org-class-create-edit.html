<form class="d-flex flex" [formGroup]="customFrom">
    <div class="d-flex flex-column flex p-3">
        <div class="row row-sm">
            <div class="col-sm-8">
                <div class="md-form-group">
                    <input class="md-input" formControlName="name"
                           [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
                    <label> Name </label>
                </div>
            </div>
            <div class="col-sm-4">
                <select-dropdown [items]="apiResolver.masterType?.studyMode" title="Study Mode"
                                 (cb)="updateStudyMode($event)" [control]="formStudyModeType"></select-dropdown>
            </div>
            <div class="col-sm-6">
                <div formArrayName="classSections">
                    <div *ngFor="let item of formClassSection.controls; let i = index;">
                        <div class="form-row" [formGroupName]="i">
                            <button type="button" class="btn btn-sm btn-icon float-left p-2 m-2" (click)="deleteRow(i)"><i class="fa fa-minus"></i></button>
                                <div class="md-form-group float-label col-sm-5">
                                    <input class="md-input" type="text" formControlName="name">
                                    <label>Class Section Name</label>
                                </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-sm btn-icon float-left p-2 m-2" (click)="addNewRow(null)"><i class="fa fa-plus"></i></button>
            </div>
            <div class="col-sm-6">
                <user-type-ahead controlTitle="Class Teacher"
                                 userType="employee" (cb)="updateReportedToId($event)"
                                 [controlId]="formClassTeacherId?.value"
                                 [controlValue]="formClassTeacherName?.value"></user-type-ahead>
            </div>
        </div>
    </div>

    <ng-template #footerTemplate>
        <div class="col-sm-12 text-right">
            <button type="submit" class="btn btn-sm primary m-2" [disabled]="!customFrom.valid || submitted"
                    (click)="onSubmit(customFrom)">
                <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
                {{ submitted ? 'Submitting...' : actionType }}
            </button>
        </div>
    </ng-template>
</form>
