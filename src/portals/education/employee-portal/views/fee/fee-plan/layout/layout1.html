<div class="app-content box-shadow-0">
    <div class="navbar flex-nowrap box-shadow">
        <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none">
            <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
        </a>
        <div class="navbar-text flex p-0">
            <h6 class="mb-0"> Fee Master </h6>
            <small class="float-left">Management</small>
        </div>
        <ul class="nav nav-xs flex-row no-border text-xs">
            <li class="nav-item">
                <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
            </li>
        </ul>
    </div>
    <div class="content-main d-flex flex" id="content-main">
        <div id="content-aside" class="app-aside fade box-shadow-x nav-expand white" aria-hidden="true">
            <div class="sidenav modal-dialog b-theme dk white">
                <div class="flex hide-scroll">
                    <div class="scroll">
                        <!--<div class="nav-stacked nav-active-theme">-->
                        <div class="nav-active-theme">
                            <ul class="nav" *ngFor="let nav of navList">
                                <li *ngIf="nav && nav.key" class="nav-header hidden-folded">
                                    <span class="text-xs">{{nav?.key }}</span>
                                </li>
                                <li class="nav-item" *ngFor="let item of nav?.children" routerLinkActive="active">
                                    <a [routerLink]="item.route" [fragment]="item['code']">
                                        <span class="nav-icon"><i [class]="item?.icon"></i> </span>
                                        <span class="nav-text">{{item?.key }}</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex flex">
            <div class="d-flex flex" id="content-body">
                <div class="d-flex flex-column flex">
                    <div class="navbar flex-nowrap box-shadow">
                        <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none">
                            <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
                        </a>
                        <ng-template *ngTemplateOutlet="pageTitleTemplate"></ng-template>
                        <!--<ul class="nav nav-xs flex-row no-border">
                            <li class="nav-item">
                                <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
                            </li>
                        </ul>-->
                    </div>
                    <router-outlet (activate)='onActivate($event)'></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
