<div class="d-flex flex p-3">
    <div class="fade aside aside-sm">
        <div class="d-flex flex-column w-sm modal-dialog">
            <div class="scrollable hover">
                <div class="list-group list-group-gap">
                    <span class="p-1 text-muted">Study Mode</span>
                    <ng-template ngFor let-row [ngForOf]="lookupService.masterType?.studyMode" let-i="index">
                        <a class="list-group-item box p-1 px-2" (click)="changeStudyMode(row)" [ngClass]="{'active': (activeStudyMode.id == row.id) }">
                            <span class="float-right"><i class="fa fa-chevron-right"></i></span>
                            {{row?.name}}
                        </a>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
    <form class="d-flex flex" [formGroup]="customForm">
        <div class="d-flex flex-column flex px-2">
            <div class="nav-active-border b-primary b-theme bottom">
                <ul class="nav nav-sm nav-rounded">
                    <ng-template ngFor let-row [ngForOf]="lookupService.masterType?.studyLevel" let-i="index">
                        <li class="nav-item" (click)="changeStudyLevel(row)">
                            <a class="nav-link" [ngClass]="{'active': (activeStudyLevel.id == row.id) }">{{row.name}}</a>
                        </li>
                    </ng-template>
                </ul>
            </div>
            <div class="navbar flex-nowrap white lt box-shadow">
                <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                    <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
                </a>
                <span class="text-md text-ellipsis flex">
                    {{ activeStudyMode.name }} : {{ activeStudyLevel.name }}
                </span>
                <button class="btn btn-xs" (click)="updateFeeTypeTaxes()">Save</button>
            </div>
            <div class="scrollable hover h-100">
                <div class="col-sm-12">
                    <table class="table table-striped table-condensed cf text-xs">
                        <thead class="cf">
                        <tr>
                            <th>Fee Type</th>
                            <th>Tax Category</th>
                            <th style="width: 200px">Tax Type</th>
                            <th class="text-right">Tax</th>
                            <th style="width: 100px;" class="text-right">Addtnl Tax</th>
                            <th class="text-right"></th>
                        </tr>
                        </thead>
                        <tbody  formArrayName="feeTaxes">
                        <ng-template ngFor let-row [ngForOf]="formFeeTaxes.controls" let-i="index">
                            <tr fee-tax-row-ce [customForm]="row" [index]="i"></tr>
                        </ng-template>
                        </tbody>
                    </table>
                    <!--<button type="button" *ngIf="maxSectionCount>feeTaxesForm.controls?.length"
                            class="btn btn-sm btn-icon float-left p-2 m-2" (click)="addNewRow(null)">
                        <i class="fa fa-plus"></i>
                    </button>-->
                </div>
            </div>
        </div>
    </form>
    <!--<loader [isLoading]="loading"></loader>-->
</div>
