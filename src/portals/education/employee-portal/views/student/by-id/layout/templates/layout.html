</ng-template>
<div class="app-content box-shadow-3" role="main">
  <div class="content-main d-flex flex" id="content-main">
    <div class="d-flex flex fixed-height">
      <div class="fade aside aside-sm" id="content-aside">
        <div class="modal-dialog d-flex flex-column w-md h-100 light lt">
          <div class="sidenav hv">
            <div class="flex hide-scroll">
              <div class="scroll">
                <div class="nav-active-theme" data-nav="">
                  <ul class="nav">
                    <li class="nav-header"><span class="text-xs hidden-folded">Discover</span></li>
                    <ng-template ngFor let-item [ngForOf]="viewNavigations | sortBy:'asc': 'sortOrder'" let-i="index">
                      <li [routerLink]="[item.route]" routerLinkActive="active">
                        <a class="nav-link" [routerLink]="[item.route]" routerLinkActive="active">
                          <span class="nav-icon"><i class="fa fa-home"></i></span><span class="nav-text">{{item.name}}</span>
                        </a>
                      </li>
                    </ng-template>
                    <!--<li class="nav-header hidden-folded"><span class="text-xs">Master Types</span></li>
                    <li><a href="#"><span class="nav-icon"><i class="fa fa-history"></i> </span><span
                            class="nav-text">Tasks</span></a></li>
                    <li><a href="#"><span class="nav-icon"><i class="fa fa-calendar"></i> </span><span
                            class="nav-text">Calendar</span></a></li>-->
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex flex" id="content-body">
        <div class="d-flex flex-column flex">
          <div class="navbar flex-nowrap box-shadow">
            <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none">
              <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
            </a>
            <span>Content header</span>
            <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
          </div>
          <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
