<div class="d-flex flex">
    <form class="d-flex flex-column flex p-3" [formGroup]="customForm">
        <div class="row row-sm">
            <div class="col-sm-8">
                <div class="md-form-group">
                    <input class="md-input" formControlName="name" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
                    <label> Name </label>
                </div>
            </div>
            <div class="col-sm-4">
                <select-dropdown [items]="apiResolver?.masterType?.divisions"
                                 title="Project Division"
                                 (cb)="updateProjectDivision($event)"
                                 [control]="formProjectDivisionId"></select-dropdown>
            </div>
            <div class="col-sm-3">
                <div class="md-form-group">
                    <input class="md-input" formControlName="estimatedCost" [ngClass]="{ 'is-invalid': submitted && f['estimatedCost'].errors }">
                    <label> Estimated Cost </label>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="md-form-group">
                    <input class="md-input" type="date" formControlName="estimatedStartDate" [ngClass]="{ 'is-invalid': submitted && f['estimatedStartDate'].errors }">
                    <label> Estimated Start Date </label>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="md-form-group">
                    <input class="md-input" formControlName="approvedCost" [ngClass]="{ 'is-invalid': submitted && f['approvedCost'].errors }">
                    <label> Approved Cost </label>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="md-form-group">
                    <input class="md-input" type="date" formControlName="actualStartDate" [ngClass]="{ 'is-invalid': submitted && f['actualStartDate'].errors }">
                    <label> Actual Start Date </label>
                </div>
            </div>
            <div class="col-sm-12">
                <div class="md-form-group">
                    <textarea class="md-input" rows="2" formControlName="description" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
                    <label> Description </label>
                </div>
            </div>
            <div class="col-sm-12">
                <user-type-ahead
                        controlTitle="Employee Executive (Search using email, First/ last name)" userType="employee"
                        (cb)="updateEmployeeExecutive($event)"
                        [controlId]="formEmpExecutiveId?.value" [controlValue]="formEmpExecutive?.value"></user-type-ahead>
            </div>
        </div>
        <ng-template #footerTemplate>
            <div class="row">
                <div class="col-sm-12 text-center">
                    <button (click)="onSubmit(customForm)" class="btn btn-sm primary m-2"
                            [disabled]="!customForm.valid || submitted">
                        <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
                        {{ submitted ? 'Submitting...' : actionType }}
                    </button>
                </div>
            </div>
        </ng-template>
    </form>
</div>
