<ng-template #projectTimelineTemplateRef1 let-list="list">
    <li class="tl-header">
        <div class="btn btn-xs" data-toggle-class="timeline-center" data-target=".timeline">Project Workflow</div>
    </li>
    &lt;!&ndash;<ng-template ngFor let-process [ngForOf]="list | sortBy:'asc': 'sortOrder'" let-i="index">&ndash;&gt;
    <li class="tl-item" *ngFor="let process  of list | sortBy:'asc': 'sortOrder'; let i = index"
        [class.tl-left]="(i%2 == 0)">
        <div class="tl-wrap b-info" [attr.id]="'workflow_'+process.id">
            <span class="tl-date text-muted"><i class="fa fa-green text-success">N/A</i></span>
            &lt;!&ndash;<div class="tl-content px-0 box no-bg no-shadow">{{subProcess.name}}</div>&ndash;&gt;
            <div class="tl-content box-color b-a text-color block w-xl w-auto-xs mb-0">
                <span class="arrow b-white left pull-top hidden-left"></span>
                <span class="arrow b-white right pull-top visible-left"></span>
                <div>
                    <a data-toggle="collapse"
                       [attr.data-parent]="'#workflow_'+process.id"
                       [attr.data-target]="'#'+i+'workflow_'+process.id"
                       [value]="i+'workflow_'+process.id"
                       class="text-primary collapsed" aria-expanded="false"
                       (click)="expandProcess($event.target.value)">{{process?.name}}</a>
                    &lt;!&ndash;<div class="float-right text-xs b-a px-3">
                        <label class="md-switch"><input type="checkbox" [checked]="process.isCompleted ? 'checked': ''">
                            <i class="blue"></i> Completed</label>
                    </div>&ndash;&gt;
                    <div class="float-right text-xs px-1 b-r">
                        <small *ngIf="process.isStarted && !process.isCompleted" class="text-primary pr-2" (click)="completeProcessNow(process)">Complete Now
                        </small>
                        <small *ngIf="process.isCompleted" class="text-primary pr-2">End Date</small>
                        <div *ngIf="process.isCompleted" class="md-form-group p-0 float-right">
                            <input type="date" class="md-input" [attr.value]="process.processEndDate" (change)="onStartChange(process, $event.target.value, false)" style="height: 20px;">
                            &lt;!&ndash;<label>End Date</label>&ndash;&gt;
                        </div>
                    </div>
                    <div class="float-right text-xs px-1 b-l">
                        <small *ngIf="!process.isStarted" class="text-primary pr-2" (click)="startProcessNow(process)">
                            Start Now
                        </small>
                        <small *ngIf="process.isStarted" class="text-primary pr-2">Start Date</small>
                        <div *ngIf="process.isStarted" class="md-form-group p-0 float-right">
                            <input type="date" class="md-input" [attr.value]="process.processStartDate" (change)="onStartChange(process, $event.target.value, true)" style="height: 20px;">
                            &lt;!&ndash;<label>Start Date</label>&ndash;&gt;
                        </div>
                    </div>
                    <div class="float-right ml-2">
                        &lt;!&ndash;<task-manage [type]="processType.PROJECT_MANAGEMENT" [projectId]="process.id"></task-manage>&ndash;&gt;
                        <a class="btn btn-xs text-xs"><i class="fa fa-plus pr-1"></i>Process</a>
                        <a href="javascript:void(0)" title="add sub process" class="btn btn-xs text-xs" (click)="addProjectTask(process)"><i class="fa fa-plus pr-1"></i> Task </a>
                    </div>
                </div>
                <div class="streamline streamline-xs streamline-dotted" *ngIf="process?.tasks?.length">
                    <ng-template [ngTemplateOutlet]="subTaskTemplateRef" [ngTemplateOutletContext]="{ data: process }"></ng-template>
                </div>
                <div [attr.id]="i+'workflow_'+process.id" class="in collapse"
                     [class.show]="((i+'workflow_'+process.id)==open_process_id)">
                    <ng-container *ngIf="process.children?.length">
                        &lt;!&ndash; Invoke the recursive template. &ndash;&gt;
                        <div class="streamline pt-2">
                            <ng-template ngFor let-subProcess [ngForOf]="process?.children | sortBy:'asc': 'sortOrder'" let-i="index">
                                <div class="sl-item">
                                    <div class="sl-icon"><i class="fa fa-bolt"></i></div>
                                    &lt;!&ndash;<div class="sl-left"><img src="../assets/images/a3.jpg" alt="." class="circle"></div>&ndash;&gt;
                                    <div class="sl-content">
                                        <div class="sl-date">
                                            <span class="float-left item-title _500">{{subProcess.name}}</span>
                                            &lt;!&ndash;<a class="btn btn-outline btn-xs text-theme float-right"><i class="fa fa-plus"></i>Process</a>&ndash;&gt;
                                            <div class="float-right text-xs px-1 b-r">
                                                <small *ngIf="subProcess.isStarted && !subProcess.isCompleted"
                                                       class="text-primary pr-2"
                                                       (click)="completeProcessNow(subProcess)">Complete Now
                                                </small>
                                                <small *ngIf="subProcess.isCompleted" class="text-primary pr-2">End Date</small>
                                                <div *ngIf="subProcess.isCompleted"
                                                     class="md-form-group p-0 float-right">
                                                    <input type="date" class="md-input"
                                                           [value]="subProcess.processEndDate"
                                                           (change)="onStartChange(subProcess, $event.target.value, false)"
                                                           style="height: 20px;">
                                                    &lt;!&ndash;<label>End Date</label>&ndash;&gt;
                                                </div>
                                            </div>
                                            <div class="float-right text-xs px-1 b-l">
                                                <small *ngIf="!subProcess.isStarted" class="text-primary pr-2"
                                                       (click)="startProcessNow(subProcess)">Start Now
                                                </small>
                                                <small *ngIf="subProcess.isStarted" class="text-primary pr-2">Start
                                                    Date
                                                </small>
                                                <div *ngIf="subProcess.isStarted" class="md-form-group p-0 float-right">
                                                    <input type="date" class="md-input"
                                                           [value]="subProcess.processStartDate"
                                                           (change)="onStartChange(subProcess, $event.target.value, true)"
                                                           style="height: 20px;">
                                                    &lt;!&ndash;<label>Start Date</label>&ndash;&gt;
                                                </div>
                                            </div>
                                            &lt;!&ndash;<small class="text-warning float-right item-title px-1" *ngIf="!subProcess.tasks?.length">No Task Found</small>&ndash;&gt;
                                            <div class="float-right">
                                                <a href="javascript:void(0)" title="add sub process"
                                                   class="btn btn-xs text-xs d-block"
                                                   (click)="addProjectTask(subProcess)"><i class="fa fa-plus pr-1"></i>
                                                    Task </a>
                                            </div>
                                        </div>
                                        <div class="h-1x">
                                            <small>{{subProcess.description}}</small>
                                        </div>
                                        <div class="box-divider"></div>
                                        <div class="box-body" *ngIf="subProcess.tasks?.length">
                                            <ng-template [ngTemplateOutlet]="subTaskTemplateRef"
                                                         [ngTemplateOutletContext]="{ data: subProcess }"></ng-template>
                                        </div>
                                        &lt;!&ndash;&ndash;&gt;
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </ng-container>
                </div>
            </div>
            &lt;!&ndash;<div class="tl-content box-color block b-a">
                <span class="arrow b-info left pull-top hidden-left"></span>
                <span class="arrow b-info right pull-top visible-left"></span>
                <div class="box-header font-bold primary">{{subProcess.name}}</div>
                <div class="box-divider"></div>
                <div class="box-body text-muted">{{subProcess | json}}</div>
            </div>&ndash;&gt;
        </div>
    </li>
    &lt;!&ndash;</ng-template>&ndash;&gt;
    <li class="tl-header">
        <div class="btn btn-sm white btn-rounded">End</div>
    </li>
</ng-template>

<ng-template #subProcessTemplateRef let-data="data">
    <div class="streamline streamline-xs streamline-dotted">
        <ng-template ngFor let-process [ngForOf]="data?.children | sortBy:'asc': 'sortOrder'" let-i="index">
            <div class="sl-item b-info">
                <div class="sl-content text-xs">
                    <div class="sl-author b-b">
                        {{process.name}}
                        <ng-template [ngTemplateOutlet]="processStatusTemplateRef"
                                     [ngTemplateOutletContext]="{ data: process }"></ng-template>
                        <div class="input-group px-1">
                            <div class="px-1"><small class="text-xs text-muted">End Phase</small></div>
                            <div class="input-group-append pl-1">
                                <a class="dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true"
                                   aria-expanded="false">{{process.endPhaseName ?? '--'}} </a>
                                <div class="dropdown-menu" x-placement="bottom-start"
                                     style="position: absolute; transform: translate3d(1023px, 33px, 0px); top: 0px; left: 0px; will-change: transform;">
                                    <ng-template ngFor let-phase
                                                 [ngForOf]="apiResolver.masterType?.projectPhases | sortBy:'asc': 'sortOrder'"
                                                 let-i="index">
                                        <a class="dropdown-item" (click)="onEndStatusChange(process, phase)"
                                           [class.active]="(process.endPhaseId == phase.id)">{{phase.name}}</a>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                    <ng-template [ngTemplateOutlet]="processActionsTemplateRef"
                                 [ngTemplateOutletContext]="{ process: process }"></ng-template>
                </div>
                <div *ngIf="process?.children?.length">
                    <ng-template [ngTemplateOutlet]="subProcessTemplateRef"
                             [ngTemplateOutletContext]="{ data: process }"></ng-template>
                </div>
                <!--<div class="sl-content" *ngIf="subProcess?.tasks?.length">
                    <ng-template [ngTemplateOutlet]="taskTemplateRef"
                                 [ngTemplateOutletContext]="{ taskList: subProcess?.tasks }"></ng-template>
                </div>-->
            </div>
        </ng-template>
    </div>
    <!--<ng-template [ngTemplateOutlet]="taskTemplateRef"
                 [ngTemplateOutletContext]="{ taskList: data?.tasks }"></ng-template>-->
</ng-template>
<ng-template #taskTemplateRef let-taskList="taskList">

<ng-template #processActionsTemplateRef let-process="process" let-isParent="isParent">
    <div class="box-tool" style="right: 0px;top: 0px;">
        <ul class="nav nav-xs no-border">
            <li class="nav-item text-xs pl-2">
                <small *ngIf="!process.isStarted" class="text-primary pr-2" (click)="startProcessNow(process)">Start
                    Now
                </small>
                <small *ngIf="process.isStarted" class="text-muted pr-2">Start Date</small>
                <div *ngIf="process.isStarted" class="md-form-group p-0 float-right">
                    <input type="date" class="md-input disabled" [value]="process.processStartDate" disabled
                           (change)="onStartChange(process, $event.target.value, true)" style="height: 20px;">
                    <!--<label>Start Date</label>-->
                </div>
            </li>
            <li class="nav-item">
                <small *ngIf="process.isStarted && !process.isCompleted" class="text-primary pr-2"
                       (click)="completeProcessNow(process)">Complete Now
                </small>
                <small *ngIf="process.isCompleted" class="text-muted pr-2">End Date</small>
                <div *ngIf="process.isCompleted"
                     class="md-form-group p-0 float-right">
                    <input type="date" class="md-input disabled"
                           [value]="process.processEndDate" disabled
                           (change)="onStartChange(process, $event.target.value, false)"
                           style="height: 20px;">
                    <!--<label>End Date</label>-->
                </div>
            </li>
        </ul>
    </div>
</ng-template>

                    <div class="float-left mx-2">
                        <label class="md-check"><input type="checkbox"><i class="theme"></i> Monthly</label>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</ng-template>
<ng-template #processStatusTemplateRef let-data="data">
    <small *ngIf="data.isStarted && !data.isCompleted" class="text-success px-2">In Progress</small>
    <small *ngIf="data.isStarted && data.isCompleted" class="text-success px-2">Completed</small>
</ng-template>
