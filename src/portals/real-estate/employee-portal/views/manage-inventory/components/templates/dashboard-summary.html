<div class="list-item">
    <span class="avatar w-40 text-center rounded info theme"><span class="fa fa-female"></span></span>
    <div class="list-body" *ngIf="data && !isLoading">
        <h4 class="m-0 text-md"><a>{{data?.headerValue}} <span class="text-sm">{{data?.header}}</span></a></h4>
        <small class="text-muted">{{data?.tagHeaderValue}} {{data?.tagHeader}}</small>
    </div>
    <loader [isLoading]="isLoading"></loader>
</div>
