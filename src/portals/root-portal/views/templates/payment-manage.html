<ng-template #actionTemplate>
  <div class="payment-navbar">
    <div class="navbar-content">
      <div class="navbar-title">
        <div class="title-icon">
          <i class="fa fa-credit-card"></i>
        </div>
        <span class="title-text">Payment Configuration</span>
      </div>
      <div class="navbar-actions">
        <button class="action-btn" type="button" (click)="newPaymentProvider()">
          <i class="fa fa-plus"></i>
          <span>Add Provider</span>
        </button>
      </div>
    </div>
    <!--<div class="filter-bar">
      <div class="filter-group">
        <label class="filter-label">Filter by Country:</label>
        <select class="filter-select" (change)="filterByCountry($event)">
          <option value="">All Countries</option>
          <option *ngFor="let country of countries" [value]="country.id">
            {{ country.name }}
          </option>
        </select>
      </div>
    </div>-->
    <div class="search-bar">
      <form class="search-form" novalidate>
        <div class="search-input-group">
          <input class="search-input" placeholder="Search payment providers..." type="text">
          <div class="search-actions">
            <button class="column-btn" title="Columns">
              <i class="fa fa-th-list"></i>
            </button>
            <button class="search-btn">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</ng-template>

<ng-template #pageTitleTemplate>
  <div class="no-shadow">
    <h6 class="mb-0"> {{ pageTitle  }} </h6>
    <small class="float-left"><i [class]="pageIcon"></i> Management</small>
  </div>
</ng-template>
<div class="content-main d-flex flex" id="content-main">
  <div class="d-flex flex" data-plugin="chat">
<!--    <div class="fade aside aside-sm" id="content-aside">-->
<!--      <bank (cb)="bankClick($event)" (addAccount)="createNewAccount($event)"></bank>-->
<!--    </div>-->
    <div class="d-flex flex" id="content-body">
      <div class="d-flex flex-column flex">
        <div class="navbar flex-nowrap white lt box-shadow">
          <div class="no-shadow">
            <h6 class="mb-0"> {{ pageTitle  }} </h6>
            <small class="float-left"><i [class]="pageIcon"></i> Management</small>
          </div>
        </div>
        <div class="d-flex flex">
          <div class="d-flex flex-column flex">
            <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
              <org-grid [data]="gridData"
                        [options]="gridOptions"
                        [isLoading]="isLoading"
                        (cb)="actionCb($event)"
                        (update)="updateGrid($event)"></org-grid>
            </div>
            <div class="mt-auto">
              <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)">
              </org-grid-pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
