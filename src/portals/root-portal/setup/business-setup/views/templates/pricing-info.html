<div class="pricing-container">
    <!-- Header Section -->
    <div class="pricing-header text-center mb-3">
        <div class="header-badge mb-2">
            <span class="badge badge-primary">Pricing Plans</span>
        </div>
        <h2 class="fw-bold mb-2">Choose Your Software Solution</h2>
        <p class="text-muted mb-2">Select the perfect software package for your business</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-xl-11">
            <!-- Software Selection Tabs -->
            <div class="software-tabs-container mb-3">
                <div class="tabs-wrapper">
                    <div class="nav nav-pills software-tabs" role="tablist">
                        <ng-template ngFor let-software [ngForOf]="apiResolver.masterType.softwares" let-i="index">
                            <button class="nav-link software-tab"
                                    [class.active]="activeSoftware.code == software.code"
                                    (click)="showBySoftware(software)"
                                    type="button">
                                <div class="tab-icon">
                                    <i class="fa fa-cube"></i>
                                </div>
                                <div class="tab-content">
                                    <span class="tab-name">{{software.code}}</span>
                                    <span class="tab-desc">{{software.name}}</span>
                                </div>
                            </button>
                        </ng-template>
                    </div>
                </div>
            </div>

            <!-- Pricing Comparison Table -->
            <div class="pricing-table-card">
                <div class="card-header">
                    <div class="header-content">
                        <div class="header-icon">
                            <i class="fa fa-table"></i>
                        </div>
                        <div>
                            <h5 class="card-title mb-0">Feature Comparison</h5>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table pricing-table">
                            <thead>
                            <tr>
                                <th class="feature-column">
                                    <div class="th-content">
                                        <i class="fa fa-list-ul th-icon"></i>
                                        <span>Features</span>
                                    </div>
                                </th>
                                <ng-template ngFor let-licenseType [ngForOf]="software.licenseTypes" let-i="index">
                                    <th class="license-column">
                                        <div class="license-header">
                                            <div class="license-icon">
                                                <i class="fa fa-star"></i>
                                            </div>
                                            <div class="license-info">
                                                <h6 class="license-name text-uppercase mb-0">{{licenseType.name}}</h6>
                                                <span class="license-badge" [class.badge-success]="licenseType.isDefault" [class.badge-secondary]="!licenseType.isDefault">
                                                    {{licenseType.isDefault ? 'Recommended' : 'Standard'}}
                                                </span>
                                            </div>
                                        </div>
                                    </th>
                                </ng-template>
                            </tr>
                            </thead>
                            <tbody>
                            <ng-template ngFor let-row [ngForOf]="software.licensingFeatures" let-i="index">
                                <tr [class.feature-row-even]="i % 2 === 0" [class.feature-row-odd]="i % 2 !== 0">
                                    <td class="feature-cell">
                                        <div class="feature-content">
                                            <div class="feature-check">
                                                <i class="fa fa-check-circle"></i>
                                            </div>
                                            <div class="feature-text">
                                                <span class="feature-name">{{ row.name }}</span>
                                                <span class="feature-desc" *ngIf="row.description">{{ row.description }}</span>
                                            </div>
                                        </div>
                                    </td>
                                    <ng-template ngFor let-feature [ngForOf]="row?.softwareLicenseFeatures" let-i="index">
                                        <td class="license-cell">
                                            <div class="feature-value">
                                                <span class="value-badge" [class.value-yes]="feature.value === 'Yes' || feature.value === 'Included'" 
                                                      [class.value-no]="feature.value === 'No' || feature.value === 'Excluded'"
                                                      [class.value-custom]="feature.value !== 'Yes' && feature.value !== 'No' && feature.value !== 'Included' && feature.value !== 'Excluded'">
                                                    {{ feature.value }}
                                                </span>
                                            </div>
                                        </td>
                                    </ng-template>
                                </tr>
                            </ng-template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Software Permissions Section -->
            <div class="permissions-card">
                <div class="card-header">
                    <div class="header-content">
                        <div class="header-icon">
                            <i class="fa fa-shield-alt"></i>
                        </div>
                        <div>
                            <h5 class="card-title mb-0">Module Permissions</h5>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <module-permission-grid [permissions]="modulePermissions"></module-permission-grid>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

        padding: 1rem 0;
        max-width: 1400px;
        margin: 0 auto;
    }

    .pricing-header {
        padding: 1rem 0;

        display: inline-block;

        letter-spacing: 0.5px;
        border-radius: 50px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    .pricing-header h2 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        background-clip: text;

        letter-spacing: -0.5px;

        font-size: 0.875rem;

        background: white;
        border-radius: 12px;

        padding: 0.75rem;
        border: 1px solid rgba(0, 0, 0, 0.05);

        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;

        font-size: 1rem;

        font-weight: 600;

    }

        font-size: 1rem;

    }

        font-size: 0.75rem;

    }

        background: rgba(255, 255, 255, 0.2);

    }

    .badge-secondary {
        background: rgba(255, 255, 255, 0.1);

        padding: 0.5rem;

    }

    .feature-check {
        color: #28a745;
        font-size: 0.875rem;
        margin-top: 0.0625rem;
    }

    .feature-text {
        flex: 1;
    }

    .feature-name {
        display: block;
        font-weight: 600;
        color: #212529;
        margin-bottom: 0.125rem;
        font-size: 0.875rem;
    }

    .feature-desc {
        display: block;

    .value-yes {
        background: #d4edda;
        color: #155724;
    }

    .value-no {
        background: #f8d7da;

    }

    .value-custom {
        background: #e2e3e5;

    }

    @media (max-width: 768px) {
        .pricing-container {
            padding: 0.5rem 0;
        }

        .software-tabs {
            flex-direction: column;
        }

        .software-tab {
            min-width: 100%;
        }

        .card-body {
            padding: 0.5rem;

        .pricing-table thead th {

            font-size: 0.6875rem;
