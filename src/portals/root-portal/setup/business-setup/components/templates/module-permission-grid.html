<div class="module-permission-grid">
    <div class="modules-grid">
        <ng-template ngFor let-module [ngForOf]="permissions" let-i="index">
            <div class="module-card">
                <div class="module-card-header">
                    <div class="module-icon-wrapper">
                        <div class="module-icon">
                            <i class="fa fa-cubes"></i>
                        </div>
                    </div>
                    <div class="module-header-content">
                        <h6 class="module-title">{{ module.name }}</h6>
                        <p class="module-description">{{ module.description || 'Module features' }}</p>
                    </div>
                    <div class="module-indicator">
                        <div class="indicator-dot"></div>
                    </div>
                </div>
                
                <div class="module-card-body" *ngIf="hasChildren(module)">
                    <div class="children-list">
                        <div class="child-item" *ngFor="let child of module.children">
                            <div class="child-content">
                                <div class="child-icon">
                                    <i class="fa fa-check-circle" [class.icon-active]="child.isActive" [class.icon-inactive]="!child.isActive"></i>
                                </div>
                                <div class="child-info">
                                    <span class="child-name">{{ child.name }}</span>
                                </div>
                                <div class="child-status">
                                    <span class="status-badge" [class.status-active]="child.isActive" [class.status-inactive]="!child.isActive">
                                        {{ child.isActive ? 'On' : 'Off' }}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
        
        <div class="no-permissions" *ngIf="!permissions || permissions.length === 0">
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fa fa-shield-alt"></i>
                </div>
                <h6 class="empty-title">No Permissions</h6>
                <p class="empty-description">No module permissions configured.</p>
            </div>
        </div>
    </div>
</div>
