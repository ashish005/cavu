<div class="module-permission-grid">
    <div class="modules-grid">
        <ng-template ngFor let-module [ngForOf]="permissions" let-i="index">
            <div class="module-card">
                <div class="module-card-header">
                    <div class="module-icon-wrapper">
                        <div class="module-icon">
                            <i class="fa fa-cubes"></i>
                        </div>
                    </div>
                    <div class="module-header-content">
                        <h6 class="module-title">{{ module.name }}</h6>
                        <p class="module-description">{{ module.description || 'Module features' }}</p>
                    </div>
                    <div class="module-indicator">
                        <div class="indicator-dot"></div>
                    </div>
                </div>
                
                <div class="module-card-body" *ngIf="hasChildren(module)">
                    <div class="children-list">
                        <div class="child-item" *ngFor="let child of module.children">
                            <div class="child-content">
                                <div class="child-icon">
                                    <i class="fa fa-check-circle" [class.icon-active]="child.isActive" [class.icon-inactive]="!child.isActive"></i>
                                </div>
                                <div class="child-info">
                                    <span class="child-name">{{ child.name }}</span>
                                </div>
                                <div class="child-status">
                                    <span class="status-badge" [class.status-active]="child.isActive" [class.status-inactive]="!child.isActive">
                                        {{ child.isActive ? 'On' : 'Off' }}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
        
        <div class="no-permissions" *ngIf="!permissions || permissions.length === 0">
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fa fa-shield-alt"></i>
                </div>
                <h6 class="empty-title">No Permissions</h6>
                <p class="empty-description">No module permissions configured.</p>
            </div>
        </div>
    </div>
</div>

<style>
    .module-permission-grid {
        padding: 0;
    }

    .modules-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 0.75rem;
    }

    .module-card {
        background: white;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        overflow: hidden;
        transition: all 0.2s ease;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .module-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        border-color: #667eea;
    }

    .module-card-header {
        padding: 0.75rem;
        background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
        border-bottom: 1px solid #e9ecef;
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
    }

    .module-icon-wrapper {
        flex-shrink: 0;
    }

    .module-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 8px;
        color: white;
        font-size: 0.875rem;
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.15);
    }

    .module-header-content {
        flex: 1;
        min-width: 0;
    }

    .module-title {
        font-weight: 600;
        color: #212529;
        margin-bottom: 0.125rem;
        font-size: 0.875rem;
        line-height: 1.3;
    }

    .module-description {
        font-size: 0.75rem;
        color: #6c757d;
        margin: 0;
        line-height: 1.3;
    }

    .module-indicator {
        flex-shrink: 0;
    }

    .indicator-dot {
        width: 6px;
        height: 6px;
        background: #28a745;
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.1);
    }

    .module-card-body {
        padding: 0.5rem;
        background: white;
    }

    .children-list {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .child-item {
        padding: 0.5rem 0.75rem;
        background: #f8f9fa;
        border-radius: 6px;
        border: 1px solid #e9ecef;
        transition: all 0.15s ease;
    }

    .child-item:hover {
        background: #f0f4ff;
        border-color: #667eea;
    }

    .child-content {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .child-icon {
        flex-shrink: 0;
        font-size: 0.875rem;
    }

    .icon-active {
        color: #28a745;
    }

    .icon-inactive {
        color: #dc3545;
    }

    .child-info {
        flex: 1;
        min-width: 0;
    }

    .child-name {
        display: block;
        font-weight: 600;
        color: #212529;
        font-size: 0.8125rem;
        line-height: 1.3;
    }

    .child-status {
        flex-shrink: 0;
    }

    .status-badge {
        display: inline-block;
        padding: 0.125rem 0.5rem;
        border-radius: 50px;
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.25px;
    }

    .status-active {
        background: #d4edda;
        color: #155724;
    }

    .status-inactive {
        background: #f8d7da;
        color: #721c24;
    }

    .no-permissions {
        grid-column: 1 / -1;
        padding: 1.5rem 1rem;
    }

    .empty-state {
        text-align: center;
        padding: 1rem;
        background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
        border-radius: 8px;
        border: 2px dashed #e9ecef;
    }

    .empty-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e9ecef;
        border-radius: 50%;
        color: #6c757d;
        font-size: 1.25rem;
    }

    .empty-title {
        font-weight: 600;
        color: #212529;
        margin-bottom: 0.25rem;
        font-size: 0.875rem;
    }

    .empty-description {
        color: #6c757d;
        margin: 0;
        font-size: 0.75rem;
    }

    @media (max-width: 768px) {
        .modules-grid {
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        .module-card-header {
            padding: 0.5rem;
        }

        .module-icon {
            width: 28px;
            height: 28px;
            font-size: 0.75rem;
        }

        .module-title {
            font-size: 0.8125rem;
        }

        .module-description {
            font-size: 0.6875rem;
        }

        .module-card-body {
            padding: 0.375rem;
        }

        .child-item {
            padding: 0.375rem 0.5rem;
        }

        .child-name {
            font-size: 0.75rem;
        }
    }
</style>
