<div class="d-flex flex h-100">
    <div id="content-body" class="d-flex flex">
        <div class="d-flex flex-column flex">
            <div class="navbar flex-nowrap lt box-shadow">
                <span class="_500 flex text-primary">{{data?.name}}</span>
                <div class="nav-active-border b-warning bottom">
                    <div class="nav nav-sm">
                        <ng-template ngFor let-entity [ngForOf]="software?.licenseTypes | sortBy:'asc': 'sortOrder'" let-i="index">
                            <a class="nav-link" [class.active]="licenseType?.id == entity.id" (click)="getModulesByLicenseChange(entity)">{{ entity.name }}</a>
                        </ng-template>
                    </div>
                </div>
            </div>
            <form [formGroup]="customForm">
                <div formArrayName="modules" class="p-2 d-flex flex-wrap">
                  <div *ngFor="let moduleFormGroup of moduleForm.controls; let i = index" class="dropdown" [formGroupName]="i">
                    <div class="dropdown-menu pos-stc d-block m-1" role="menu">
                      <p class="px-2 mb-0">
                        {{ moduleFormGroup.get('name').value }}
                        <label class="ui-switch primary float-right">
                          <input type="checkbox" formControlName="isActive"><i></i>
                        </label>
                      </p>
                      <div class="dropdown-divider"></div>
                      <div formArrayName="children">
                        <div *ngFor="let childFormGroup of getChildrenArray(moduleFormGroup).controls; let j = index"
                             [formGroupName]="j" class="px-2">
                          {{ childFormGroup.get('name').value }}
                          <label class="ui-switch primary float-right">
                            <input type="checkbox" formControlName="isActive"><i></i>
                          </label>
                        </div>
                        <!--<div class="list">
                            <ng-template ngFor let-item [ngForOf]="children(i).controls" let-j="index">
                                <div class="list-item p-0" data-id="item-1">
                                    <div class="list-body">
                                        <a class="item-title _500">{{ item.get('name').value }}</a>
                                    </div>
                                    <div [formGroupName]="j">
                                        &lt;!&ndash;<label class="ui-switch primary float-right">
                                            <input type="checkbox" formControlName="status"><i></i>
                                        </label>&ndash;&gt;
                                        <label class="md-check"><input type="checkbox" formControlName="status"> <i class="green"></i></label>
                                    </div>
                                </div>
                            </ng-template>
                        </div>-->
                      </div>
                    </div>
                  </div>
                </div>
            </form>
        </div>
    </div>
</div>
<ng-template #footerTemplate>
    <ul class="nav nav-xs  no-border float-left">
        <li class="nav-item mx-2">
            <button class="btn white">{{ data.license?.licenseType }} {{ data.license?.licenseNo }} <i class="fa fa-check"></i></button>
        </li>
    </ul>
    <ul class="nav nav-xs flex-row no-border float-right">
        <li class="nav-item mx-2">
            <button class="btn btn-sm float-center" [disabled]="submitted" (click)="updateModules()">
                <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin pr-2'></i>
                {{ submitted ? 'Updating...' : 'Update Permission' }}
            </button>
        </li>
        <li class="nav-item mx-2">
            <button class="btn btn-sm float-center" [disabled]="submitted" (click)="updateModulesByLicenseType()">
                <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin pr-2'></i>
                {{ submitted ? 'Updating...' : 'Apply ' + licenseType?.name + ' License Permission' }}
            </button>
        </li>
    </ul>
</ng-template>
