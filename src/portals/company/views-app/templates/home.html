<header class="app-header">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
            <!-- Brand -->
            <a [routerLink]="['/']" class="navbar-brand d-flex align-items-center">
                <div class="brand-logo">
                    <span class="brand-text">EnRator</span>
                </div>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" *ngIf="app">
                        <div class="navbar-nav ms-auto">
                            <button class="btn btn-primary" (click)='login()'>
                                <i class="fa fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</header>
<!-- Main Content Area -->
<div class="app">
    <main class="app-content">
        <div class="content-main" id="content-main">
            <div id="wrapper" class="container">
                <div class="row no-gutters">
                    <div class="col-sm-12">
                        <div class="auth_detail" style="color: #004f7e; opacity: 0.7;">
                            <h3 class="text-monospace"> {{ app?.software?.name }} </h3>
                            <p class="p-3">{{app?.software?.description}} </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
