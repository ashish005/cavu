<header class="app-header">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
            <!-- Brand -->
            <a [routerLink]="['/']" class="navbar-brand d-flex align-items-center">
                <div class="brand-logo">
                    <span class="brand-text">EnRator</span>
                </div>
            </a>
            <div class="navbar-nav ms-auto float-right right" *ngIf="app">
                <button class="btn btn-xs btn-primary" (click)='login()'>
                    <i class="fa fa-sign-in-alt me-2"></i>Login
                </button>
            </div>
        </nav>
    </div>
</header>
<!-- Main Content Area -->
<div class="app">
    <main class="app-content">
        <div class="content-main" id="content-main">
            <div id="wrapper" class="container">
                <div class="row no-gutters">
                    <div class="col-sm-12">
                        <div class="auth_detail" style="color: #004f7e; opacity: 0.7;">
                            <h3 class="text-monospace"> {{ app?.software?.name }} </h3>
                            <p class="p-3">{{app?.software?.description}} </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
