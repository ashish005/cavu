<div class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="text-center mb-5">
                    <div class="d-flex flex-column align-items-center">
                        <div class="mb-3">
                            <span class="avatar w-56 bg-success text-white rounded-circle d-flex align-items-center justify-content-center">
                                <span class="fa fa-money fa-2x"></span>
                            </span>
                        </div>
                        <div>
                            <h1 class="display-5 fw-bold">Pricing Simplified</h1>
                            <p class="lead text-muted">for your business</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="nav nav-tabs border-info mb-4" role="tablist">
            <ng-template ngFor let-software [ngForOf]="apiResolver.masterType.softwares" let-i="index">
                <button class="nav-link" [class.active]="activeSoftware?.code == software.code"
                        (click)="showBySoftware(software)" type="button">
                    {{software.code}}
                </button>
            </ng-template>
        </div>
    </div>
    <div class="container">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white text-center">
                <h2 class="fw-bold mb-0">Plan Comparison Chart</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th><span class="fw-bold">Features</span></th>
                                <ng-template ngFor let-licenseType
                                             [ngForOf]="software.licenseTypes" let-i="index">
                                    <th class="text-center">
                                        <div class="fw-bold">
                                            <h6 class="text-uppercase mb-0">{{licenseType.name}}</h6>
                                        </div>
                                    </th>
                                </ng-template>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-template ngFor let-row [ngForOf]="software.licensingFeatures"
                                         let-i="index">
                                <tr>
                                    <td><span class="fw-bold text-sm">{{ row.name }}</span></td>
                                    <ng-template ngFor let-feature
                                                 [ngForOf]="row?.softwareLicenseFeatures"
                                                 let-i="index">
                                        <td class="text-center">
                                            <span class="badge bg-light text-dark">{{ feature.value }}</span>
                                        </td>
                                    </ng-template>
                                </tr>
                            </ng-template>
                        </tbody>
                    </table>
                </div>
                <div class="alert alert-info text-center" *ngIf="!software.licensingFeatures?.length">
                    <i class="fa fa-info-circle me-2"></i>
                    Plan is Under Review
                </div>
            </div>
        </div>
    </div>
    <!--<pricing-plan></pricing-plan>-->
</div>
