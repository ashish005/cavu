<header class="app-header white box-shadow-1">
    <div class="navbar navbar-expand-lg">
        <!--<a class="d-lg-none mx-2" data-toggle="modal" data-target="#aside">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
                <path d="M80 304h352v16H80zM80 248h352v16H80zM80 192h352v16H80z"></path>
            </svg>
        </a>-->
        <a [routerLink]="['/']" class="navbar-brand">
            <svg height="30" width="60">
                <a target="_blank">
                    <text x="0" y="15" fill="#124f7acc">En</text>
                    <text x="10" y="30" fill="#124f7acc">Rator</text>
                </a>
            </svg>
            <!--<img src="../assets/images/logo.svg" alt="." class="hide">-->
            <span class="hide hidden-folded d-inline">EnRator</span>
        </a>
        <div class="navbar-text nav-title flex"></div>
        <ul class="navbar-nav mt-2 mt-lg-0 mx-0 mx-lg-2 text-hover-primary nav-active-border">
            @if (appSetup && appSetup?.sectorMasterType !== 'COMPANY') {
                <li class="nav-item"><button class="btn btn-success mr-1" (click)='login()'>login</button></li>
            }
          @if (appSetup?.sectorMasterType === 'COMPANY') {
            <li class="nav-item" ><a [routerLink]="['/pricing']" routerLinkActive="active" class="nav-link">Pricing Plan</a></li>
            <li class="nav-item"><a [routerLink]="['/trial']" routerLinkActive="active" class="nav-link"> Trial</a></li>
          }
        </ul>
    </div>
</header>
<div class="app container">
    <div id="content" class="app-content box-shadow-1 box-radius-1" role="main">
        <div class="content-main d-flex flex" id="content-main">
            <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
    </div>
</div>
