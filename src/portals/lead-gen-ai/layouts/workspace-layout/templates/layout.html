<header class="app-header theme flex-nowrap box-shadow">
  <org-header></org-header>
</header>
<div id="app" class="app">
  <org-aside showInbox="true" [data]="navList"></org-aside>
  <div id="content" class="app-content box-shadow-0" role="main">
    <div class="content-header white box-shadow" id="content-header">
      <!--d-lg-none-->
      <div class="navbar navbar-expand-lg">
        <a class="d-lg-none mx-2" data-toggle="modal" data-target="#aside">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
            <path d="M80 304h352v16H80zM80 248h352v16H80zM80 192h352v16H80z"></path>
          </svg>
        </a>
        <div class="navbar-text nav-title flex" id="pageTitle"></div>
        <ul class="nav flex-row order-lg-2">
          <ng-template *ngTemplateOutlet="navbarRightTemplate"></ng-template>
        </ul>
      </div>
    </div>
    <div class="pl-3 pr-3 py-2">
      <app-breadcrumb></app-breadcrumb>
    </div>
    <div class="client-override" *ngIf="clientOverride">
      <span><i class="fa fa-user-secret"></i> Viewing <b>{{ clientOverride }}</b> as agency operator</span>
      <button class="btn btn-sm" (click)="exitOverride()">Exit to agency</button>
    </div>
    <div class="content-main d-flex flex" id="content-main">
        <router-outlet (activate)='onActivate($event)'></router-outlet>
    </div>
  </div>
</div>
<ng-template #navbarRightTemplate>
    <li class="nav-item d-flex align-items-center px-2 position-relative">
      <input class="studio-search" [(ngModel)]="q" (ngModelChange)="quickFilter()"
             placeholder="Quick jump: entities, agents, workflows…" autocomplete="off"/>
      <div class="jump-results" *ngIf="qResults.length">
        <a *ngFor="let r of qResults" (click)="go(r)">
          <span class="jr-label">{{ r.label }}</span><span class="jr-hint">{{ r.hint }}</span>
        </a>
      </div>
    </li>
    <li class="nav-item d-flex align-items-center px-2">
      <select class="studio-switch" [ngModel]="studio.workspace?.key" (ngModelChange)="switchWorkspace($event)" title="Workspace">
        <option *ngFor="let w of workspaces" [value]="w.key">{{ w.label }}</option>
      </select>
    </li>
    <li class="nav-item d-flex align-items-center px-2">
      <select class="studio-switch" [ngModel]="studio.industry?.key" (ngModelChange)="switchIndustry($event)" title="Industry">
        <option *ngFor="let i of industries" [value]="i.key">{{ i.label }}</option>
      </select>
    </li>
    <li class="nav-item d-flex align-items-center px-2">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()" [title]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <i [class]="darkMode ? 'fa fa-sun' : 'fa fa-moon'"></i>
      </button>
    </li>
</ng-template>
