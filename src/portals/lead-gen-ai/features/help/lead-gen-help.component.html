<main class="help-page">
  <header class="page-header">
    <div>
      <h1>Help & Guide</h1>
      <p class="subtitle">Quick answers — login, demo data, screens and troubleshooting</p>
    </div>
  </header>

  <div class="help-grid">
    <section class="panel" *ngFor="let s of sections">
      <h3><i [class]="s.icon"></i> {{ s.title }}</h3>
      <div class="qa" *ngFor="let item of s.items">
        <p class="q">{{ item.q }}</p>
        <p class="a">{{ item.a }}</p>
      </div>
    </section>
  </div>
</main>
