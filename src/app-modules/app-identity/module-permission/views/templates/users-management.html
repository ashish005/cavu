<div class="d-flex flex-column flex">
  <div class="navbar flex-nowrap lt">
    <div class="navbar-text flex p-0"><h6 class="mb-0">User Permission</h6>
      <small class="float-left"></small>
    </div>
    <user-list-search></user-list-search>
  </div>
  <div class="d-flex flex-column flex">
    <div class="d-flex flex-column flex">
      <div class="scroll-y">
        <org-grid [data]="gridData" [options]="gridOptions" (cb)="actionCb($event)" (update)="updateGrid($event)"></org-grid>
      </div>
    </div>
    <div class="mt-auto">
      <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                           (cb)="moveToPage($event)">
      </org-grid-pagination>
    </div>
  </div>
</div>
