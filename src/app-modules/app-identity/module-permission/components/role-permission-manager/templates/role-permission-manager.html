<div class="app-content box-shadow-0" role="main">
    <div class="content-main d-flex flex">
        <div class="d-flex flex">
            <div class="fade aside aside-sm">
                <div class="modal-dialog d-flex flex-column w-md light lt">
                    <div class="nav-header px-3">
                        <div class="b-b pb-2">
                            <span class="text-muted">User Roles</span>
                        </div>
                    </div>
                    <!--<a class="nav-link">
                        <btn *ngIf="showNew" class="btn btn-xs btn-rounded d-block theme" (click)="newRole()">
                            <i class="fa fa-plus pr-2"></i> New Role
                        </btn>
                    </a>-->
                    <div class="scrollable hover">
                        <div class="list-group list-group-gap p-2" *ngIf="singleRole">
                            <div class="list-group-item p-1 pl-2 _500"
                                 *ngFor="let row of lookup?.userRoles; let i = index"
                                 [ngClass]="{'primary text-white': (activeUserType?.id == row.id)}">
                                <div class="float-right">
                                    <a class="btn btn-xs btn-icon" *ngIf="activeUserType?.id != row.id"
                                       (click)="showDetails(row)"><i class="fa fa-chevron-right"></i></a>
                                    <a class="btn btn-xs btn-icon" *ngIf="activeUserType?.id == row.id"
                                       (click)="clearFilter(row)"><i class="fa fa-close"></i></a>
                                </div>
                                {{row.name}}
                            </div>
                        </div>
                        <form [formGroup]="customForm" *ngIf="!singleRole">
                            <div class="list mx-2 box" formArrayName="roles">
                                <div class="list-item p-0" *ngFor="let rule of formRoles?.controls" [formGroup]="rule">
                                    <div class="list-body py-1">
                                        <a class="_500">{{rule.value.name}}</a>
                                    </div>
                                    <div>
                                    <span class="nav-badge"><label class="md-check my-1">
                                          <input type="checkbox" formControlName="hasRole"
                                                 (change)="applyRole()"><i></i><span></span></label>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="d-flex flex">
                <div class="d-flex flex-column flex">
                    <div class="navbar flex-nowrap box-shadow">
                        <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none"
                           data-pjax-state=""><span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span></a>
                        <div class="item-title _500 text-muted">
                            Module Permission
                        </div>
                        <a class="float-right" *ngIf="showPermissionUpdateButton">
                            <span class="btn btn-xs btn-block theme" (click)="updateRoles()"> Update</span>
                        </a>
                    </div>
                    <div class="scroll-y box m-0">
                        <table class="table text-xs table-condensed" [formGroup]="customForm">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Module</th>
                                <th>Full Access</th>
                                <th>
                                    <div class="text-xs">
                                        <div class="d-inline-block px-1" style="font-size: .6em;color: green;">Manage
                                        </div>
                                        <div class="d-inline-block px-1" style="font-size: .8em;">View</div>
                                        <div class="d-inline-block px-1 b-l b-r" style="font-size: .8em;">Create</div>
                                        <div class="d-inline-block px-1" style="font-size: .8em;">Modify</div>
                                    </div>
                                </th>
                                <th>Soft Delete</th>
                                <th>Destroy</th>
                                <!--<th>Import</th>
                                <th>Export</th>-->
                            </tr>
                            </thead>
                            <tbody formArrayName="moduleRight">
                            <ng-template ngFor let-rule [ngForOf]="formModuleRight?.controls" let-i="index">
                                <ng-container [formGroup]="rule">
                                    <tr>
                                        <module-permission-row [customForm]="rule"></module-permission-row>
                                    </tr>
                                </ng-container>
                                <ng-container *ngIf="getModulePermissions(rule) as subPerms">
                                    <tr *ngFor="let ruleItem of subPerms.controls; let k = index" [formGroup]="ruleItem">
                                        <ng-container *ngIf="k === 0">
                                            <td [attr.rowspan]="subPerms.controls.length"
                                                style="border-top: none; border-right: 1px solid #e9ebed;"></td>
                                        </ng-container>

                                        <sub-module-permission-row [customForm]="ruleItem"></sub-module-permission-row>
                                    </tr>
                                </ng-container>
                            </ng-template>
                            </tbody>
                        </table>
                        <loader [isLoading]="isLoading"></loader>
                    </div>
                    <div class="mt-auto"></div>
                </div>
            </div>
        </div>
    </div>
</div>
