                <ul class="nav flex-column nav-sm">
                    <li class="nav-item" (click)="goStep('config')"><a class="nav-link">Configuration</a>

                    <li class="nav-item" (click)="goStep('sync')"><a class="nav-link">Sync Org / Branch</a>
                    </li>
