<div class="h-100 d-flex flex-column" *ngIf="parent && parent.selectedProcess">
    <div class="p-2 px-3 border-bottom d-flex justify-content-between align-items-center bg-white">
        <span class="text-muted text-sm font-weight-bold">Transitions Flow</span>
        <button class="btn btn-xs b-theme text-theme text-xs border-0" (click)="onTransitionCreate($event)">
            <i class="fa fa-plus mr-1"></i> Add Transition
        </button>
    </div>
    <div class="flex-grow-1 overflow-hidden position-relative" style="background: #f8f9fa;">
        <ngx-graph
            *ngIf="nodes && nodes.length"
            class="chart-container"
            style="width: 100%; height: 100%; display: block;"
            [links]="links"
            [nodes]="nodes"
            [layout]="'dagre'"
            [enableZoom]="true"
            [draggingEnabled]="true"
            [panningEnabled]="true"
            (nodeClick)="onNodeClick($event)"
            (linkClick)="onTransitionLinkClick($event)"
        >
            <ng-template #defsTemplate>
                <svg:marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M0,-5L10,0L0,5" class="arrow-head" fill="#999" />
                </svg:marker>
            </ng-template>

            <ng-template #nodeTemplate let-node>
                <svg:g class="node">
                    <svg:rect
                        [attr.width]="node.dimension.width"
                        [attr.height]="node.dimension.height"
                        [attr.fill]="node.data.color"
                        rx="5" ry="5"
                        stroke="#fff" stroke-width="2"
                        style="filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1));"
                    />
                    <svg:text alignment-baseline="central" [attr.x]="node.dimension.width / 2" [attr.y]="node.dimension.height / 2" fill="#fff" font-size="12" text-anchor="middle">
                        {{node.label}}
                    </svg:text>
                </svg:g>
            </ng-template>

            <ng-template #linkTemplate let-link>
                <svg:g class="edge">
                    <svg:path class="line" stroke-width="2" stroke="#999" marker-end="url(#arrow)" [attr.d]="link.line"></svg:path>
                </svg:g>
            </ng-template>
        </ngx-graph>
        <div *ngIf="!nodes || !nodes.length" class="d-flex h-100 justify-content-center align-items-center text-muted">
            No phases defined to display flowchart.
        </div>
    </div>
</div>
