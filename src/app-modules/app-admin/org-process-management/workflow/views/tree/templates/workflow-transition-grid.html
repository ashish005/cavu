<div class="h-100 d-flex flex-column" *ngIf="parent && parent.selectedProcess">
    <div class="p-2 px-3 border-bottom d-flex justify-content-between align-items-center bg-white">
        <div class="d-flex align-items-center">
            <span class="text-muted text-sm font-weight-bold mr-3">Transitions Flow</span>
            <span class="text-muted text-xs" *ngIf="!selectedSourceNodeId">Click a node to start a transition; click an arrow to edit.</span>
            <span class="text-primary text-xs font-weight-bold" *ngIf="selectedSourceNodeId">Select a destination node to complete the connection...</span>
        </div>
        <button class="btn btn-xs b-theme text-theme text-xs border-0" (click)="onTransitionCreate($event)">
            <i class="fa fa-plus mr-1"></i> Add Transition
        </button>
        <div class="ml-auto btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" [class.active]="viewMode==='phase'" (click)="setViewMode('phase')">
                Phase Transition View
            </button>
            <button class="btn btn-outline-secondary" [class.active]="viewMode==='state'" (click)="setViewMode('state')">
                Phase State Transition View
            </button>
        </div>
    </div>
    <div class="flex-grow-1 overflow-hidden position-relative" style="background: #f8f9fa;">
        <ngx-graph
            *ngIf="nodes && nodes.length"
            class="chart-container"
            style="width: 100%; height: 100%; display: block;"
            [links]="links"
            [nodes]="nodes"
            [clusters]="clusters"
            [layout]="'dagre'"
            [curve]="curve"
            [enableZoom]="true"
            [zoomSpeed]="0.1"
            [draggingEnabled]="true"
            [panningEnabled]="true"
            (nodeClick)="onNodeClick($event)"
            (linkClick)="onTransitionLinkClick($event)"
        >
            <ng-template #defsTemplate>
                <svg:marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M0,-5L10,0L0,5" class="arrow-head" fill="#999" />
                </svg:marker>
                <svg:filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <svg:feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1" />
                </svg:filter>
            </ng-template>

            <ng-template #clusterTemplate let-cluster>
                <svg:g class="node cluster">
                    <svg:rect
                        [attr.width]="cluster.dimension.width"
                        [attr.height]="cluster.dimension.height"
                        [attr.fill]="cluster.data.color"
                        fill-opacity="0.08"
                        rx="8" ry="8"
                        stroke-width="0"
                    />
                    <!-- Top accent bar -->
                    <svg:path 
                        [attr.d]="'M0,8 a8,8 0 0 1 8,-8 h' + (cluster.dimension.width - 16) + ' a8,8 0 0 1 8,8 v4 h-' + cluster.dimension.width + ' z'"
                        [attr.fill]="cluster.data.color"
                        fill-opacity="0.2"
                    />
                    <svg:text 
                        [attr.x]="10" 
                        [attr.y]="20" 
                        [attr.fill]="cluster.data.color" 
                        font-size="12" 
                        font-weight="bold"
                        style="text-transform: uppercase; letter-spacing: 0.5px;"
                    >
                        {{cluster.label}}
                    </svg:text>
                </svg:g>
            </ng-template>

            <ng-template #nodeTemplate let-node>
                <svg:g class="node" [attr.transform]="'translate(0,0)'" style="cursor: pointer;">
                    <svg:rect
                        [attr.width]="node.dimension.width"
                        [attr.height]="node.dimension.height"
                        fill="#fff"
                        rx="4" ry="4"
                        [attr.stroke]="node.data.isSelected ? '#000' : node.data.color"
                        [attr.stroke-width]="node.data.isSelected ? 2 : 1"
                        filter="url(#dropShadow)"
                    />
                    <!-- Left color bar -->
                    <svg:rect
                        x="0" y="0"
                        width="6"
                        [attr.height]="node.dimension.height"
                        [attr.fill]="node.data.color"
                        rx="4" ry="4"
                    />
                    <!-- Square off the right side of the color bar to blend -->
                    <svg:rect
                        x="4" y="0"
                        width="2"
                        [attr.height]="node.dimension.height"
                        [attr.fill]="node.data.color"
                    />
                    
                    <svg:text alignment-baseline="central" [attr.x]="node.dimension.width / 2 + 5" [attr.y]="node.dimension.height / 2" fill="#444" font-size="13" font-weight="500" text-anchor="middle">
                        {{node.label}}
                    </svg:text>

                    <!-- Selection Indicator -->
                    <svg:circle *ngIf="node.data.isSelected" [attr.cx]="node.dimension.width - 10" [attr.cy]="10" r="4" fill="#28a745" />
                </svg:g>
            </ng-template>

            <ng-template #linkTemplate let-link>
                <svg:g class="edge" style="cursor: pointer;">
                    <!-- Invisible wide path for easier clicking -->
                    <svg:path class="line-click-area" stroke-width="15" stroke="transparent" [attr.d]="link.line" fill="none" style="pointer-events: stroke;"></svg:path>
                    <svg:path class="line" stroke-width="2" stroke="#bbb" marker-end="url(#arrow)" [attr.d]="link.line" fill="none"></svg:path>
                    <svg:rect 
                         [attr.x]="getLinkLabelX(link) - (link.label.length * 3 + 10)" 
                         [attr.y]="getLinkLabelY(link) - 10" 
                         [attr.width]="link.label.length * 6 + 20" 
                         height="18" 
                         rx="9" 
                         fill="#fff" 
                         stroke="#eee"
                         stroke-width="1"
                         *ngIf="link.label"
                    />
                    <svg:text fill="#666" font-size="10" text-anchor="middle" [attr.x]="getLinkLabelX(link)" [attr.y]="getLinkLabelY(link) + 3">{{link.label}}</svg:text>
                </svg:g>
            </ng-template>
        </ngx-graph>
        <div *ngIf="!nodes || !nodes.length" class="d-flex h-100 justify-content-center align-items-center text-muted">
            No phases defined to display flowchart.
        </div>
    </div>
</div>
