<ng-template #recursiveList let-nodes>
    <div class="list-group list-group-gap px-2">
        <div *ngFor="let node of nodes" class="list-group-item p-1 pl-2 box">
            <div class="list-body text-xs">
                <a class="_500">{{ node.name }}</a>
            </div>
            <div class="float-right">
                    <a class="btn btn-xs b-theme text-theme text-xs border-0" (click)="showWorkflow(node)">
                        Workflow
                        <i class="fa fa-gears"></i>
                    </a>
                    <a class="btn btn-xs btn-icon" (click)="selectNode(node)">
                        <i class="fa fa-chevron-right"></i>
                    </a>
                </div>
            <!-- 🔁 Call template again -->
            <div class="pl-2" *ngIf="node.children?.length">
                <ng-container *ngTemplateOutlet="recursiveList; context:{ $implicit: node.children }">
                </ng-container>
            </div>
        </div>
    </div>
</ng-template>
