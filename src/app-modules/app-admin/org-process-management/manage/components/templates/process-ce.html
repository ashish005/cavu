<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <form class="p-3" [formGroup]="customForm" (submit)="onSubmit(customForm)">
            <div class="row row-sm">
                <div class="col-sm-6">
                    <div class="md-form-group">
                        <input class="md-input" formControlName="name"
                               [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
                        <label> Name </label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <user-type-ahead controlTitle="Incharge"
                                     userType="employee" (cb)="updateInchargeId($event)"
                                     [controlId]="formInchargeId.value"
                                     [controlValue]="formInchargeName.value"></user-type-ahead>
                </div>
                <div class="col-sm-12">
                    <div class="md-form-group">
                        <input class="md-input" formControlName="description"
                               [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
                        <label> Description </label>
                    </div>
                </div>
            </div>
            <table class="table small-table text-xs table-condensed">
                <thead class="cf">
                <tr>
                    <td></td>
                    <th>Phase</th>
                    <th width="50px">Default</th>
                    <th width="100px" class="text-right">Order</th>
                    <th width="100px" class="text-right">Active</th>
                </tr>
                </thead>
                <tbody formArrayName="phases">
                <ng-container *ngFor="let phase of phases.controls; let i = index">
                    <tr [formGroupName]="i">
                        <!-- Phase Row -->
                        <td>
                            <button *ngIf="!phase.value.id" type="button" (click)="removePhase(i)">🗑️</button>
                            <button type="button" (click)="addStep(null, i)">+ Step</button>
                        </td>
                        <td>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <input formControlName="color" type="color" style="width: 30px" class="md-input no-border">
                                </div>
                                <input formControlName="name" class="form-control md-input no-border" placeholder="Phase name">
                            </div>
                        </td>
                        <td class="text-center"><input type="checkbox" formControlName="isDefault"></td>
                        <td><input type="number" formControlName="sortOrder" style="width: 45px" class="md-input no-border text-right"></td>
                        <td class="text-center"><input type="checkbox" formControlName="isActive"></td>
                    </tr>
                    <!-- STEPS SECTION -->
                    <tr>
                        <td colspan="6" class="p-0" [formGroupName]="i">
                            <table class="table small-table" *ngIf="steps(i).length > 0">
                                <thead>
                                <tr>
                                    <th>Approver #</th>
                                    <th>Role</th>
                                    <th width="100px">Order</th>
                                    <th width="100px">Active</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody formArrayName="approvalSteps">
                                <ng-container *ngFor="let step of steps(i).controls; let j = index">
                                    <!-- STEP ROWS -->
                                    <tr [formGroupName]="j">
                                        <td>{{ j + 1 }}</td>
                                        <td><input formControlName="approverRole" placeholder="Role"
                                                   class="md-input no-border"></td>
                                        <td><input type="number" formControlName="stepOrder" style="width: 45px;"
                                                   class="md-input no-border text-right"></td>
                                        <td><input type="checkbox" formControlName="isActive"></td>
                                        <td>
                                            <button type="button" (click)="addRule(null, i, j)">+ Rule</button>
                                            <!--<button type="button" class="danger" (click)="removeStep(i, j)">Delete</button>-->
                                        </td>
                                    </tr>
                                    <!-- RULES SECTION -->
                                    <tr>
                                        <td colspan="5" [formGroupName]="j">
                                            <!-- RULES ARRAY -->
                                            <table class="table small-table" *ngIf="rules(i,j).length > 0">
                                                <thead>
                                                <tr>
                                                    <th width="50px">Rule #</th>
                                                    <th>Property</th>
                                                    <th>Operator</th>
                                                    <th>Value</th>
                                                    <th width="100px">Active</th>
                                                    <!--<th></th>-->
                                                </tr>
                                                </thead>
                                                <tbody formArrayName="rules">
                                                <tr *ngFor="let rule of rules(i,j).controls; let k = index"
                                                    [formGroupName]="k">
                                                    <td>{{ k + 1 }}</td>
                                                    <td><input formControlName="propertyName" placeholder="Property"
                                                               class="md-input no-border"></td>
                                                    <td><input formControlName="operator" placeholder="Operator"
                                                               class="md-input no-border"></td>
                                                    <td><input formControlName="value" placeholder="Value"
                                                               class="md-input no-border"></td>
                                                    <td><input type="checkbox" formControlName="isActive"></td>
                                                    <!--<td><button type="button" class="danger" (click)="removeRule(i, j, k)">Delete</button></td>-->
                                                </tr>
                                                </tbody>
                                            </table>
                                            <!-- Empty state -->
                                            <!--<div class="empty" *ngIf="rules(i,j).length === 0">
                                                No rules.
                                                <button type="button" (click)="addRule(null, i, j)">Add Rule</button>
                                            </div>-->
                                        </td>
                                    </tr>
                                </ng-container>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </ng-container>
                </tbody>
            </table>
            <ng-template #footerTemplate>
                <div class="mt-auto">
                    <button class="btn btn-xs theme" type="button" (click)="addPhase(null)">Add Phase</button>
                    <div class="float-left px-2">
                        <status-check [customForm]="customForm"></status-check>
                    </div>
                    <div class="float-right">
                        <button type="submit" class="btn btn-sm primary" (click)="onSubmit(customForm)" [disabled]="!customForm.valid || submitted">
                            <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i> {{ submitted ? 'Submitting...' : actionType }}
                        </button>
                    </div>
                </div>
            </ng-template>
        </form>
    </div>
</div>
