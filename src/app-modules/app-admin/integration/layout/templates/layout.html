<div class="app-content box-shadow-0" role="main">
  <div class="content-header white box-shadow-0">
    <div class="navbar flex-nowrap">
      <a data-toggle="modal" data-target="#content-aside" class="mr-1 d-md-none">
        <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
      </a>
      <div class="no-shadow">
        <h6 class="mb-0"> {{page?.title}} </h6>
        <small class="float-left"> Setup Management</small>
      </div>
    </div>
  </div>
  <div class="content-main d-flex flex">
    <div class="d-flex flex">
      <div class="fade aside aside-sm" id="content-aside">
        <div class="modal-dialog d-flex flex-column w-md light lt" id="user-nav">
          <div class="scrollable hover">
            <div class="list-group list-group-gap p-2">
              <ng-template ngFor let-row [ngForOf]="lookupResolver?.masterType.items | sortBy:'asc': 'sortOrder'" let-j="index">
                <a class="list-group-item p-1 px-2 _500" (click)="routeToUrl(row)">
                  <span class="float-right ml-2"><i class="fa fa-chevron-right"></i></span> {{row.name}}
                </a>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex flex">
        <div class="d-flex flex-column flex">
          <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
