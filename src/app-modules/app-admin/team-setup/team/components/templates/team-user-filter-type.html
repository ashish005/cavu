<ng-template #actionTemplate></ng-template>
<div class="flex">
    <div class="d-flex flex-column">
        <div class="b-b text-center text-sm-right m-2 text-center">
            <div class="nav-active-border b-theme bottom box mb-0">
                <div class="nav nav-md">
                    <ng-template ngFor let-row [ngForOf]="lookupResolver.masterType.userTypes" let-i="index">
                        <a class="nav-link text-center" [class.active]="userMasterTypeId==row.id"
                           (click)="routeToUserTypeView(row)">{{row?.name}}</a>
                    </ng-template>
                </div>
            </div>
        </div>
        <div class="d-flex flex">
            <div class="d-flex flex-column flex h-100">
                <div class="scroll-y d-flex flex-column flex box">
                    <div class="animate fadeIn">
                        <div class="no-more-tables">
                            <table class="p-0 table table-striped table-condensed cf">
                                <thead class="cf">
                                <tr>
                                    <th class="text-xs text-muted _500">Name</th>
                                    <th style="width: 20px;"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <ng-template ngFor let-row [ngForOf]="filterList" let-i="index">
                                    <tr>
                                        <td class="text-sm _500" data-title="Name">{{ row.name }}</td>
                                        <td><a><i class="fa fa-lock"></i></a></td>
                                    </tr>
                                </ng-template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
