<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <div class="navbar flex-nowrap">
            <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span>
            </a>
            <div>
                <h6 class="mb-0">Manage Team</h6>
                <small class="clearfix"></small>
            </div>
            <ul class="nav nav-xs flex-row no-border float-right">
                <li class="nav-item">
                    <button type="submit" class="btn btn-xs b-a theme b-theme text-theme" (click)="createNewTeam()">
                        New Team
                    </button>
                </li>
            </ul>
        </div>
        <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
            <org-grid [data]="gridData"
                      [options]="gridOptions"
                      [isLoading]="isLoading"
                      (cb)="actionCb($event)"
                      (update)="updateGrid($event)"></org-grid>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)">
            </org-grid-pagination>
        </div>
    </div>
</div>
