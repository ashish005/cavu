<div class="d-flex flex">
  <div class="d-flex flex-column flex">
    <div class="navbar flex-nowrap box-shadow">
      <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
        <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
      </a>
      <button id="sort" class="btn btn-sm white ml-1 sort" data-sort="item-title" data-toggle="tooltip" title="" data-original-title="Sort"><i class="fa fa-sort"></i></button>
    </div>
    <div class="scroll-y">
      <div class="list animate fadeIn" id="data-log">
        <ng-template ngFor let-row [ngForOf]="gridData" let-i="index">
          <div class="list-item">
            <div class="list-body">
              <a class="item-title _500">{{row | json}}</a>
              <div class="item-except text-sm text-muted h-1x">Homepage mockup design</div>
              <div class="item-tag tag hide">Trash</div>
            </div>
            <div><span class="item-date text-xs text-muted">13:23</span></div>
            <div>
              <a class="item-title text-xs" data-toggle="collapse" data-parent="#data-log" [attr.data-target]="'#datalog_'+i">See Details</a>
            </div>
          </div>
          <div id="datalog_{{i}}" class="collapse in bg-transparent">
            <div class="flex flex-row">
              <div class="flex flex-column">
                <div class="pl-3 pr-3">

                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </div>
      <div class="no-result" [ngClass]="{ 'hide': (gridData?.length)}">
        <div class="p-4 text-center">No Results</div>
      </div>
    </div>
    <div class="mt-auto">
      <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)"></org-grid-pagination>
    </div>
  </div>
</div>
