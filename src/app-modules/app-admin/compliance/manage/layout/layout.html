<div id="content" class="app-content box-shadow-0" role="main">
    <div class="content-main d-flex flex" id="content-main">
        <div class="fade aside aside-sm" id="content-aside">
            <div class="modal-dialog d-flex flex-column w-md">
                <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
                <div class="scrollable hover px-3">
                    <div class="list-group list-group-gap">
                        <a class="list-group-item box p-1 px-2" [routerLink]="['list']" routerLinkActive="active">
                            <span class="float-right"><i class="fa fa-chevron-right"></i></span> Compliance
                        </a>
                        <a class="btn btn-xs text-primary text-xs text-theme text-right m-2"
                           (click)="newRegulatoryAuthority()"><i class="fa fa-plus"></i> New Regulatory Authorities
                        </a>
                        <a class="list-group-item box p-1 px-2" [routerLink]="['regulatory']"
                           routerLinkActive="active">
                            <span class="float-right"><i class="fa fa-chevron-right"></i></span> Regulatory
                            Authorities
                        </a>
                    </div>
                </div>
                <div class="p-3 mt-auto"><span class="text-sm text-muted"></span></div>
            </div>
        </div>
        <div class="d-flex flex" id="content-body">
            <div class="d-flex flex-column flex">
                <div class="navbar flex-nowrap white lt box-shadow">
                    <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none"
                       data-pjax-state="">
                        <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span>
                    </a>
                    <ng-template *ngTemplateOutlet="pageTitleTemplate"></ng-template>
                    <div class="nav-active-border b-theme">
                        <ul class="nav">
                            <li class="nav-item mx-1">
                                <a class="btn btn-sm btn-outline border text-theme b-theme" (click)="showMasterTypePopup()"><i class="fa fa-hand-grab-o pr-2"></i>Master Type</a>
                            </li>
                        </ul>
                    </div>
                </div>
                <router-outlet (activate)='onActivate($event)'></router-outlet>
            </div>
        </div>
    </div>
</div>
