<form class="d-flex flex" [formGroup]="customForm">
    <div class="d-flex flex" id="content-body">
        <div class="d-flex flex-column flex">
            <div class="d-flex flex">
                <div class="d-flex flex-column flex p-2">
                    <div class="row row-sm">
                        <div class="col-sm-7">
                            <div class="md-form-group">
                                <input class="md-input" formControlName="name" [ngClass]="{ 'is-invalid': submitted && f.name.errors }">
                                <label> Name </label>
                            </div>
                        </div>
                        <div class="col-sm-5">
                            <div class="md-form-group">
                                <select class="md-input" formControlName="taskId">
                                    <ng-template ngFor let-entity [ngForOf]="apiResolver.masterType?.orgTaskConfigs" let-i="index">
                                        <option [value]="entity.id">{{entity.name}}</option>
                                    </ng-template>
                                </select>
                                <label>Task</label>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="md-form-group">
                                <input class="md-input" formControlName="description" [ngClass]="{ 'is-invalid': submitted && f.description.errors }">
                                <label> Description </label>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="md-form-group">
                                <select class="md-input" formControlName="regulatoryId">
                                    <ng-template ngFor let-entity [ngForOf]="apiResolver.masterType?.regulatories" let-i="index">
                                        <option [value]="entity.id">{{entity.name}}</option>
                                    </ng-template>
                                </select>
                                <label>Regulatory Authorities</label>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="md-form-group">
                                <select class="md-input" formControlName="complianceTypeId">
                                    <ng-template ngFor let-entity [ngForOf]="apiResolver.masterType?.complianceTypes" let-i="index">
                                        <option [value]="entity.id">{{entity.name}}</option>
                                    </ng-template>
                                </select>
                                <label>Compliance Type</label>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="md-form-group">
                                <select class="md-input" formControlName="subscriptionId">
                                    <ng-template ngFor let-entity [ngForOf]="subscriptions" let-i="index">
                                        <option [value]="entity.id">{{entity.name}}</option>
                                    </ng-template>
                                </select>
                                <label>Subscription</label>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="md-form-group">
                                <select class="md-input text-xs" formControlName="taxRegimeId">
                                    <option *ngFor="let entity of apiResolver.masterType?.taxRegimes;" [ngValue]="entity.id"> {{entity.name}}</option>
                                </select>
                                <label class="text-xs text-muted m-0">Tax Regime</label>
                            </div>
                        </div>
                        <!--<div class="col-sm-3">
                            <div class="md-form-group">
                                <input class="md-input text-right" style="width: 70px" formControlName="rate" [ngClass]="{ 'is-invalid': submitted && f.rate.errors }">
                                <select class="md-input" formControlName="calculationType" style="width: 70px">
                                    <option *ngFor="let entity of apiResolver.masterType?.calculationTypes;" [ngValue]="entity.id"> {{entity.name}}</option>
                                </select>
                                <label class="text-xs text-muted m-0">Rate</label>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="md-form-group">
                                <div class="text-xs" style="float: right;position: absolute;top: 0px;right: 0px;">
                                    <label class="md-check">
                                        <input type="checkbox" formControlName="isExemptedForTaxation">
                                        <i class="theme"></i>Tax Exempted
                                    </label>
                                </div>
                                <input class="md-input" type="number" formControlName="taxRebateRate" [ngClass]="{ 'is-invalid': submitted && f.taxRebateRate.errors }">
                                <label>Tax Credit Rate (%)</label>
                            </div>
                        </div>-->
                        <div class="col-sm-6">
                            <user-type-ahead
                                    controlTitle="Employee Executive (Search using email First/ last name)"
                                    userType="employee"
                                    (cb)="updateEmpExecutive($event)"
                                    [controlId]="formEmpExecutiveId?.value"
                                    [controlValue]="formEmpExecutive?.value"></user-type-ahead>
                        </div>
                        <div class="col-sm-6">
                            <!--<add-reminder [orgTaskId]="orgTaskId"></add-reminder>
                            <task-schedule [orgTaskId]="orgTaskId"></task-schedule>-->
                        </div>
                    </div>
                </div>
            </div>
            <div class="mx-2 white lt b-t mt-auto">
                <div class="row row-sm">
                    <div class="col-sm-12 text-center">
                        <button type="click" class="btn btn-sm primary m-2" data-dismiss="modal"
                                (click)="onSubmit(customForm)"
                                [disabled]="!customForm.valid || submitted">
                            <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i> {{ submitted ? 'Submitting...' : actionType}}
                        </button>
                    </div>
                </div>
            </div>
            <!--<loader [isLoading]="isLoading"></loader>-->
        </div>
    </div>
</form>
