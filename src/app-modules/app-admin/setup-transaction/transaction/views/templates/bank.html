<ng-template #actionTemplate>
    <ul class="nav">
        <li class="nav-item mr-2">
            <button class="btn btn-sm btn-block btn-rounded theme" (click)="createNew()">
                <i class="fa fa-plus pr-2"></i> New {{ pageTitle  }}
            </button>
        </li>
    </ul>
</ng-template>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> {{ pageTitle  }} </h6>
        <small class="float-left"><i [class]="pageIcon"></i> Management</small>
    </div>
</ng-template>
<div class="container padding">
    <div class="py-5 clearfix">
        <div class="text-center mb-5">
            <h5 class="_500">Connect your bank for automatic transaction management</h5>
            <h6 class="my-4 text-muted">
                Connect your bank and credit cards to fetch all your transactions.
                Create, categorize and match these transactions to those you have in Enrator.
            </h6>
            <div class="justify-content-center">
                <button class="btn rounded btn-outline b-primary text-primary px-4 mx-4">Connect Bank/Credit Card </button>
                <!--<button class="btn btn-secondary empty-list-button">Add Manually</button>-->
            </div>
            <div class="my-4">
                <p>Don't use banking for your business? Skip this step</p>
            </div>
        </div>
    </div>

    <div class="d-flex flex">
        <div class="d-flex flex-column flex">
            <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
                <org-grid [data]="gridData"
                          [options]="gridOptions"
                          [isLoading]="isLoading"
                          (cb)="actionCb($event)"
                          (update)="updateGrid($event)"></org-grid>
            </div>
            <div class="mt-auto">
                <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)">
                </org-grid-pagination>
            </div>
        </div>
    </div>
</div>
