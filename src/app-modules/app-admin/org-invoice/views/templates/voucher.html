<div class="d-flex flex scroll-y">
  <div class="d-flex flex-column flex">
    <div class="navbar flex-nowrap box-shadow">
      <div class="navbar-text flex p-0">
        <h6 class="mb-0">{{ apiResolver.vType?.name }}</h6>
        <div>
          <voucher-config [vType]="apiResolver.vType"></voucher-config>
        </div>
      </div>
      <ul class="nav nav-xs flex-row no-border" *ngIf="apiResolver.vType">
        <li class="nav-item mr-2">
          <button class="btn btn-xs text-theme b-theme" (click)="newVoucher(apiResolver.vType)">
            <i class="fa fa-plus pr-2"></i> new {{apiResolver.vType?.name}}
          </button>
        </li>
        <li class="nav-item">
          <button class="btn btn-xs text-theme b-theme"><i class="fa fa-hand-grab-o pr-2"></i>
            Activities
          </button>
        </li>
      </ul>
    </div>
    <div class="scroll-y d-flex flex-column flex box bg-transparent no-border m-0 b-none">
      <org-grid [data]="gridData"
                [options]="gridOptions"
                [isLoading]="isLoading"
                (cb)="actionCb($event)"
                (update)="updateGrid($event)"></org-grid>
    </div>
    <div class="mt-auto">
      <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                           (cb)="moveToPage($event)">
      </org-grid-pagination>
    </div>
  </div>
</div>
