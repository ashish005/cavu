<div class="d-flex flex">
    <div class="d-flex flex" data-plugin="user">
        <div class="fade aside aside-sm b-r" id="content-aside" style="display: none;" aria-hidden="true">
            <div class="modal-dialog d-flex flex-column w w-xs">
                <div class="scrollable hover">
                    <div class="sidenav mt-2">
                        <div class="nav-active-border left b-primary">
                            <ul class="nav flex-column nav-sm" *ngFor="let nav of navList">
                                <li class="nav-header hidden-folded"><span class="nav-item px-1 text-muted" *ngIf="nav?.key">{{nav.key  }}</span></li>
                                <li class="nav-item" *ngFor="let item of nav?.children" routerLinkActive="active">
                                    <a class="nav-link" [routerLink]="item.routeTo" [fragment]="item.code">{{item?.key  }}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex flex" id="content-body">
            <div class="d-flex flex-column flex" id="user-list">
                <div class="navbar no-radius box-shadow pos-rlt">
                    <a data-toggle="modal" data-target="#content-aside" data-modal="" class="ml-1 d-md-none"
                       data-pjax-state="external"><span class="btn btn-sm btn-icon primary"><i
                            class="fa fa-th"></i></span></a>
                    <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
                </div>
                <router-outlet (activate)='onActivate($event)'></router-outlet>
            </div>
        </div>
    </div>
</div>
