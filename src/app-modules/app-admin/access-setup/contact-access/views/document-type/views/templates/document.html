<ng-template #actionTemplate>
</ng-template>
<div class="content-main d-flex flex" id="content-main">
    <div class="d-flex flex" data-plugin="chat">
        <div class="fade aside aside-sm" id="content-aside">
            <div class="d-flex flex-column w-xl">
                <div class="p-2 px-3 text-muted text-sm">Document Category</div>
                <div class="scrollable hover">
                    <div class="list-group list-group-gap mx-1">
                        <ng-template ngFor let-row [ngForOf]="lookupResolver.masterType?.categories" let-i="index">
                            <div class="list-group-item box py-1 pr-1">
                                <div>
                                    <span class="btn btn-xs btn-icon float-right" (click)="showDetails(row)"><i class="fa fa-chevron-right"></i></span>
                                </div>
                                <a class="item-title _500">{{ row.name }}</a>
                            </div>
                        </ng-template>
                    </div>
                </div>
                <!--<div class="p-3 mt-auto"><span class="text-sm text-muted"></span></div>-->
            </div>
        </div>
        <div class="d-flex flex" id="content-body">
            <div class="d-flex flex-column flex" id="chat-list">
                <div class="navbar flex-nowrap white lt box-shadow">
                    <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                        <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span></a>
                    <span class="text-md text-ellipsis flex"> Document Rules</span>
                </div>
                <div class="scrollable hover">
                    <org-grid [data]="gridData"
                              [options]="gridOptions"
                              [isLoading]="isLoading"
                              (cb)="actionCb($event)"
                              (update)="updateGrid($event)">
                    </org-grid>
                </div>
                <div class="mt-auto">
                    <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                                         (cb)="moveToPage($event)"></org-grid-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
