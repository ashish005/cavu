<div class="d-flex flex">
  <form class="d-flex flex-column flex p-3" [formGroup]="customForm">
    <div class="row row-sm">
      <div class="col-sm-6">
        <div class="md-form-group">
          <input class="md-input" formControlName="name" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
          <label> Name </label>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="md-form-group">
          <input class="md-input" formControlName="minSize" [ngClass]="{ 'is-invalid': submitted && f['minSize'].errors }">
          <label> Min Size </label>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="md-form-group">
          <input class="md-input" formControlName="maxSize" [ngClass]="{ 'is-invalid': submitted && f['maxSize'].errors }">
          <label> Max Size </label>
        </div>
      </div>
      <div class="col-sm-12">
        <div>
          <h6 class="pb-0">Document Rule</h6>
          <small>These rules will be applicable for organization</small>
        </div>
        <table class="table small-table text-sm">
            <thead>
            <tr>
              <th>User Type</th>
              <th>Mandatory</th>
              <th>Verification Required</th>
              <th>Status</th>
            </tr>
            </thead>
            <tbody formArrayName="rules">
              <ng-template ngFor let-rule [ngForOf]="formRules?.controls" let-i="index">
                <tr [formGroup]="rule">
                  <td><strong class="text-muted">{{rule.get('userTypeName').value}}</strong></td>
                  <td><label class="md-check"><input type="checkbox" formControlName="isMandatory"><i class="success"></i><span></span></label></td>
                  <td><label class="md-check"><input type="checkbox" formControlName="isVerificationRequired"><i class="success"></i><span></span></label></td>
                  <td><label class="md-check"><input type="checkbox" formControlName="status"><i class="success"></i><span></span></label></td>
                </tr>
              </ng-template>
            </tbody>
          </table>
      </div>
    </div>
    <ng-template #footerTemplate>
      <div class="col-sm-12 text-right">
        <button type="submit" class="btn btn-sm primary m-2" [disabled]="!customForm.valid || submitted" (click)="onSubmit(customForm)">
          <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i> {{ submitted ? 'Submitting...' : actionType }}
        </button>
      </div>
    </ng-template>
  </form>
</div>
