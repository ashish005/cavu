<div class="app-content box-shadow-0" role="main">
    <div class="content-header" id="content-header">
        <div class="navbar navbar-expand-lg">
            <a class="d-lg-none mx-2" data-toggle="modal" data-target="#aside" data-pjax-state="">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512">
                    <path d="M80 304h352v16H80zM80 248h352v16H80zM80 192h352v16H80z"></path>
                </svg>
            </a>
<!--            <div class="navbar-text nav-title flex" id="pageTitle"> {{ pageTitle  }}</div>-->
            <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
            <div class="nav-active-border b-theme px-4 px-md-5">
                <ul class="nav">
                    <ng-template ngFor let-userType [ngForOf]="lookupResolver.masterType.userTypes" let-i="index">
                        <li class="nav-item">
                            <a class="nav-link" [class.active]="userMasterType==userType.masterType">{{userType.name}}</a>
<!--                            (click)="routeToUserTypeView(userType)"-->
                        </li>
                    </ng-template>
                </ul>
            </div>
        </div>
    </div>
    <div class="content-main d-flex flex" id="content-main">
        <div class="d-flex flex" data-plugin="chat">
            <div class="fade aside aside-sm" id="content-aside">
                <div class="d-flex flex-column w-md h-100 light lt">
                    <div class="sidenav hv">
                        <div class="p-2 px-3 text-muted text-sm">User Access Setup</div>
                        <div class="flex hide-scroll">
                            <div class="scroll">
                                <div class="list-group list-group-gap px-2">
                                    <ng-template ngFor let-item [ngForOf]="viewNavigations | sortBy:'asc': 'sortOrder'" let-i="index">
                                        <div class="list-group-item box py-1 pr-1 ng-star-inserted">
                                            <div><a class="btn btn-xs btn-icon float-right" [routerLink]="[item.route]" routerLinkActive="active"><i class="fa fa-chevron-right"></i></a></div>
                                            <a class="item-title _500">{{item.name}}</a>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex" id="content-body">
                <div class="d-flex flex-column flex">
                    <router-outlet (activate)='onActivate($event)'></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
