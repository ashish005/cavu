<div class="app-content box-shadow-0" role="main">
    <div class="content-main d-flex flex" id="content-main">
        <div class="d-flex flex">
            <div class="fade aside aside-sm" id="content-aside">
                <div class="d-flex flex-column w-md h-100 light lt">
                    <div class="sidenav hv">
                        <div class="p-2 px-3 text-muted text-sm">User Access Setup</div>
                        <div class="flex hide-scroll">
                            <div class="scroll">
                                <div class="list-group list-group-gap px-2">
                                    <ng-template ngFor let-item [ngForOf]="viewNavigations | sortBy:'asc': 'sortOrder'" let-i="index">
                                        <div class="list-group-item box py-1 pr-1 ng-star-inserted">
                                            <div><a class="btn btn-xs btn-icon float-right" [routerLink]="[item.route]" routerLinkActive="active"><i class="fa fa-chevron-right"></i></a></div>
                                            <a class="item-title _500">{{item.name}}</a>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex" id="content-body">
                <div class="d-flex flex-column flex">
                    <router-outlet (activate)='onActivate($event)'></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
