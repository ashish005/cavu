</ng-template>
<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <div class="scroll-y" data-target="#content-aside">
            <div class="list animate fadeIn">
                <ng-template ngFor let-item [ngForOf]="gridData" let-i="index">
                    <div class="list-item" (click)="navigateToDetails(item)">
                        <div>
                            <span>
                                <i *ngIf="item?.isEmail" class="fa fa-envelope text-success"></i>
                                <i *ngIf="item?.isSms" class="fa fa-mobile text-accent"></i>
                                <i *ngIf="item?.isInbox" class="fa fa-inbox text-primary"></i>
                            </span>
                        </div>
                        <div class="list-body">
                            <a class="item-title _500">{{item.header}}</a>
                            <!--<div class="item-except text-sm text-muted h-1x">{{item.content}}</div>-->
                            <div class="item-tag tag hide">Trash</div>
                        </div>
                        <div>
                            <button class="btn btn-xs white mx-1">Recipient <b class="text-success ml-2">{{item.recipientCount }}</b></button>
                            <span class="item-date text-xs text-muted">{{item.scheduledDeliveredTime}}</span>
                        </div>
                    </div>
                </ng-template>
            </div>
            <div class="no-result" *ngIf="!gridData?.length">
                <div class="p-4 text-center">No Results</div>
            </div>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)"></org-grid-pagination>
        </div>
    </div>
</div>
