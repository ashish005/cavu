<div class="d-flex flex">
    <div class="d-flex flex-column flex box m-0 box-shadow">
        <div class="scroll-y m-1 p-3">
            <div class="clearfix">
                <h6 class="mb-0 _500">
                    <div [innerHTML]="conversation?.header" style="white-space: pre-line"></div>
                </h6>
            </div>
            <div class="clearfix py-1">
                <div class="d-block float-left pr-1">
                    <span class="circle w-32 mr-2"><i class="fa fa-user"></i></span>
                    <span>To</span>
                </div>
                <ul class="nav nav-xs flex-row no-border scroll-x float-left">
                    <ng-template ngFor let-rcpt [ngForOf]="conversation?.recipientList" let-i="index">
                        <li class="nav-item mr-2">
                            <a class="btn btn-xs no-shadow b b-theme text-xs" [ngSwitch]="conversation?.mediaMasterType">
                                <span *ngSwitchCase="'email'">{{rcpt.email || '--' }}</span>
                                <span *ngSwitchCase="'sms'">{{rcpt.mobile || '--' }}</span>
                                <span *ngSwitchDefault>{{rcpt.name || '--' }}</span>
                            </a>
                        </li>
                    </ng-template>
                </ul>
            </div>
            <div class="clearfix b-t py-2">
                <div [innerHTML]="conversation?.content" style="white-space: pre-wrap"></div>
            </div>
