<form [formGroup]="customFrom"  (submit)="onSubmit(customFrom)">
  <div class="row row-sm">
    <div class="col-sm-6">
      <div class="md-form-group">
        <input class="md-input" formControlName="name" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
        <label> Name </label>
      </div>
    </div>
    <!--<div class="col-sm-6">
      <select-dropdown [items]="apiResolver?.masterType?.roles" title="User Role" (cb)="updateUserRole($event)" [control]="formUserRoleId"> </select-dropdown>
    </div>-->
    <div class="col-sm-12 text-center">
      <button type="submit" class="btn btn-sm primary m-2" [disabled]="!customFrom.valid || submitted">
        <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
        {{ submitted ? 'Submitting...' : actionType }}
      </button>
    </div>
  </div>
</form>
