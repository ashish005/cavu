<div class="app-content box-shadow-0" role="main">
  <div class="navbar light lt p-0" *ngIf="user">
    <ul class="nav nav-sm no-border">
      <li class="nav-item b-l">
        <a class="nav-link">
          <b class="d-block">{{ user?.fName }} {{ user?.lName }}</b>
          {{ user?.email }}
          <span class="b-r pr-1 border-right"></span>
          <small class="text-muted pl-2 pr-1 border-right">{{ user?.phone }}</small>
        </a>
      </li>
    </ul>
  </div>
  <div class="content-main d-flex flex">
    <div id="content-aside">
      <div class="d-flex flex-column w-md light lt">
        <div class="scrollable hover">
          <div class="list-group list-group-gap p-2">
            <ng-template ngFor let-item [ngForOf]="items | sortBy:'asc': 'sortOrder'" let-i="index">
              <a class="list-group-item p-0 px-2" (click)="changeView(item)">
                <span class="float-right py-1"><i class="fa fa-chevron-right"></i></span>
                <span class="nav-text p-1"><i [class]="item.icon" class="pr-2"></i>{{item.name }}</span>
              </a>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
    <!--<div class="d-flex flex-column flex" [ngSwitch]="activeView?.route">
      <employee-info *ngSwitchCase="'info'" [id]="id" [data]="user"></employee-info>
      <employee-doc *ngSwitchCase="'documents'" [id]="id" [data]="user"></employee-doc>
      <employee-info *ngSwitchDefault [id]="id" [data]="user"></employee-info>
    </div>-->
  </div>
</div>
