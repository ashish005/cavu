<div class="app-content box-shadow-0" role="main">
    <div class="navbar light lt p-0">
        <ul class="nav nav-sm no-border">
            <li class="nav-item">
                <a class="nav-link text-muted" (click)="goBack()">
                    <span class="nav-text"><i class="fa fa-fw fa-mail-reply-all"></i></span>
                </a>
            </li>
            <!--<li class="nav-item p-2 b-l b-r">
                <ng-template *ngTemplateOutlet="pageTitleTemplate"></ng-template>
            </li>-->
            <li class="nav-item b-l">
                <a class="nav-link">
                    <b class="d-block">{{moduleResolver.vendor?.name}}</b>
                    {{moduleResolver.vendor?.code}}
                    <span class="b-r pr-1 border-right"></span>
                    <small class="text-muted pl-2 pr-1 border-right">{{moduleResolver.vendor?.address}}</small>
                </a>
            </li>
        </ul>
        <ul class="nav nav-xs flex-row no-border">
            <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
            <li class="nav-item mr-2">
                <button class="btn btn-sm btn-outline border text-theme b-theme"><i class="fa fa-plus pr-2"></i>Activities </button>
            </li>
        </ul>
    </div>
    <div class="content-main d-flex flex">
        <div id="content-aside">
            <div class="d-flex flex-column w-md light lt">
                <div class="scrollable hover">
                    <div class="list-group list-group-gap p-2">
                        <ng-template ngFor let-item [ngForOf]="apiResolver.items | sortBy:'asc': 'sortOrder'" let-i="index">
                            <a class="list-group-item p-0 px-2" [routerLink]="[item.route]" routerLinkActive="active">
                                <span class="float-right py-1"><i class="fa fa-chevron-right"></i></span>
                                <span class="nav-text p-1"><i [class]="item.icon" class="pr-2"></i>{{item.name }}</span>
                            </a>
                        </ng-template>
                    </div>
                    <div class="px-3 py-2 text-muted text-sm">{{apiResolver.reportItems.name}}</div>
                    <div class="list-group list-group-gap p-2 text-xs _500">
                        <ng-template ngFor let-item [ngForOf]="apiResolver.reportItems?.children" let-i="index">
                            <a class="list-group-item p-1 px-2">{{ item.name}}</a>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex flex-column flex">
            <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
    </div>
</div>
