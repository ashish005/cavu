<ng-template #pageTitleTemplate>
    <a class="no-shadow">
        <h6 class="mb-0"> {{pageTitle }}</h6>
        <small class="float-left">Management</small>
    </a>
</ng-template>
<ng-template #actionTemplate>
    <li class="nav-item mx-1">
        <button class="btn btn-sm btn-block btn-rounded theme" (click)="createNew()"><i class="fa fa-fw fa-plus"></i> Create Client</button>
    </li>
</ng-template>
<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <div class="navbar flex-nowrap lt">
            <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span>
            </a>
            <ul class="nav nav-xs flex-row no-border">
                <li class="nav-item b-a mx-1">
                    <a class="btn btn-xs btn-icon float-right" *ngIf="isOverDueActive" (click)="removeFilterAction()">
                        <i class="fa fa-close"></i> </a>
                    <button class="btn btn-sm btn-outline text-theme b-theme" type="button" (click)="getOverDue()">
                        <a class="active" *ngIf="isOverDueActive"><i class="fa fa-check text-success d-none"></i></a>
                        Over Due
                    </button>
                </li>
                <li class="nav-item b-a mx-1">
                    <a class="btn btn-xs btn-icon float-right" *ngIf="isOutstandingActive" (click)="removeFilterAction()"> <i class="fa fa-close"></i> </a>
                    <button class="btn btn-sm btn-outline text-theme b-theme" type="button" (click)="getOnlyOutstanding()">
                        <a class="active" *ngIf="isOutstandingActive"><i
                                class="fa fa-check text-success d-none"></i></a>
                        Total Outstanding
                    </button>
                </li>
                <li class="nav-item b-a mx-1">
                    <a class="btn btn-xs btn-icon float-right" *ngIf="isInDraftActive" (click)="removeFilterAction()">
                        <i class="fa fa-close"></i> </a>
                    <button class="btn btn-sm btn-outline text-theme b-theme" type="button" (click)="getOnlyInDraft()">
                        <a class="active" *ngIf="isInDraftActive"><i class="fa fa-check text-success d-none"></i></a>
                        In Drafts
                    </button>
                </li>
            </ul>
            <ul class="nav nav-xs flex-row no-border float-right">
                <!--<li class="nav-item">
                    <master-search></master-search>
                </li>-->
                <li class="nav-item">
                    <button class="btn btn-sm white ml-1 sort" data-sort="item-title" data-toggle="tooltip" title="" data-original-title="Sort"><i class="fa fa-sort"></i></button>
                </li>
            </ul>
        </div>
        <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
            <org-grid [data]="gridData"
                      [options]="gridOptions"
                      [isLoading]="isLoading"
                      (cb)="actionCb($event)"
                      (update)="updateGrid($event)"></org-grid>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                                 (cb)="moveToPage($event)">
            </org-grid-pagination>
        </div>
    </div>
</div>
