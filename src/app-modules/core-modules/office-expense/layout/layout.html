          <div class="scrollable hover">

                  <span class="text-muted text-sm">{{nav.key }}</span>
                </div>

<ng-template #groupRowTemplate let-row='row'>
  <div class="list-item p-1">
    <div class="list-body">
      <a class="text-xs _500" [routerLink]="['ledger', row.id ]" routerLinkActive="active">{{row?.name}}</a>
      <!--<div class="item-except text-sm text-muted h-1x">Detail</div>-->
      <div class="item-tag tag hide"></div>
    </div>
    <div class="m-0">
      <a class="mx-2 item-title _500 text-xs" *ngIf="row?.accountCount>0">{{row?.accountCount}}</a>
      <a *ngIf="row?.isLocked" class="btn btn-xs m-0 btn-icon"><i class="fa fa-lock"></i></a>
      <span *ngIf="!row?.isLocked" class="btn btn-xs m-0 btn-icon" title="edit" (click)="editAccountGroupAction(row)"><i class="fa fa-edit"></i></span>
      <span class="btn btn-xs m-0 btn-icon float-right" [routerLink]="['ledger', row.id ]">
        <i class="fa fa-chevron-right"></i>
      </span>
    </div>
  </div>
  <ng-template ngFor let-childRow [ngForOf]="row?.children" let-j="index">
    <!--<div class="b-l ml-2">-->
      <ng-container [ngTemplateOutlet]="groupRowTemplate" [ngTemplateOutletContext]="{row:childRow}"></ng-container>
    <!--</div>-->
  </ng-template>
</ng-template>
