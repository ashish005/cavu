<ng-template #actionTemplate>
    <!--<li class="nav-item mr-2">
        <button class="btn btn-sm btn-outline border text-theme b-theme" (click)="createNew()">
            <i class="fa fa-plus pr-2"></i> New {{ pageTitle }}
        </button>
    </li>-->
</ng-template>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> {{ pageTitle }} </h6>
        <small class="float-left"><i [class]="pageIcon"></i> Management</small>
    </div>
</ng-template>
<div class="d-flex flex-column flex">
    <div class="navbar flex-nowrap lt">
        <ul class="nav nav-xs flex-row no-border">
            <li class="nav-item">

            </li>
        </ul>
        <ul class="nav nav-xs flex-row no-border float-right">
            <li class="nav-item">
                <!--<master-search></master-search>-->
            </li>
            <li class="nav-item">
                <button class="btn btn-sm white ml-1 sort" data-sort="item-title" data-toggle="tooltip" title="" data-original-title="Sort"><i class="fa fa-sort"></i></button>
            </li>
        </ul>
    </div>
    <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
        <!--<org-grid [data]="gridData"
                  [options]="gridOptions"
                  [isLoading]="isLoading"
                  (cb)="actionCb($event)"
                  (update)="updateGrid($event)"></org-grid>-->
        <div class="animate fadeIn">
            <div class="no-more-tables">
                <table class="p-0 table table-striped table-condensed cf">
                    <thead class="cf">
                    <tr>
                        <th style="width:30px" *ngIf="(gridOptions?.header?.edit)">
                            <!--<label class="md-check m-0"><input type="checkbox" (change)="checkUncheckAll()"> <i class="indigo"></i></label>-->
                        </th>
                        <th *ngFor="let head of gridOptions?.columnDefs;" [class]="head.class" class="text-xs">{{head?.headerName}}</th>
                        <th style="width:30px" *ngIf="gridOptions?.header?.delete"></th>
                        <th style="width:20px"></th>
                    </tr>
                    </thead>
                    <tbody class="scroll-y">
                        <!-- Initiate the recursive template rendering. -->
                        <ng-template ngFor let-gData [ngForOf]="gridData" let-i="index">
                            <ng-container [ngTemplateOutlet]="groupRow" [ngTemplateOutletContext]="{ row:gData, level: 0}"></ng-container>
                        </ng-template>
                    </tbody>
                    <!--<tbody class="scroll-y">
                    <ng-template ngFor let-gData [ngForOf]="gridData" let-i="index">
                        <ng-container [ngTemplateOutlet]="groupRow" [ngTemplateOutletContext]="{ row:gData}"></ng-container>
                        <ng-template ngFor let-childRow [ngForOf]="gData.children" let-j="index">
                            <ng-container [ngTemplateOutlet]="groupRow" [ngTemplateOutletContext]="{ row:childRow, isChild: true}"></ng-container>
                        </ng-template>
                    </ng-template>
                    </tbody>-->
                </table>
                <loader [isLoading]="isLoading"></loader>
            </div>
        </div>
        <div class="no-result" [class.hide]="(gridData?.length || isLoading)">
            <div class="p-4 text-center">No Result</div>
        </div>
    </div>
    <div class="mt-auto">
        <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)">
        </org-grid-pagination>
    </div>
</div>
<ng-template #groupRow let-row='row' let-level='level' let-isChild='isChild'>
    <tr [attr.rowId]="row.id">
        <td *ngIf="(gridOptions?.header?.edit)">
            <!--<label class="btn btn-xs btn-icon ui-check m-0">
              <input type="checkbox" name="post[]" (change)="checkValue(row)"><i class="dark-white"></i>
            </label>-->
            <!--<label class="md-check"><input type="checkbox" (change)="checkValue(row)"> <i class="indigo"></i></label>-->
            <a class="btn btn-xs btn-icon m-0" href="javascript:void(0)" title="edit" (click)="performAction(row)"><i class="fa fa-edit"></i></a>
        </td>
        <td *ngFor="let col of gridOptions?.columnDefs; let i=index"
            [attr.data-title]="col?.headerName" class="text-sm _500">
            <ng-template #withCellFnTemplate> {{col.cellFn(row)}}</ng-template>
            <ng-template #withoutCellTemplate><span [style.padding-left]="level*10+'px'">{{row[col?.field]}}</span>  </ng-template>
            <ng-template #withCellTemplate><dynamic-content [context]="row" [component]="col.cellTemplate" [col]="col"></dynamic-content></ng-template>
            <ng-container *ngTemplateOutlet="col.cellTemplate ? withCellTemplate : (col?.cellFn)? withCellFnTemplate: withoutCellTemplate"></ng-container>
        </td>
        <td style="text-align: center;" *ngIf="gridOptions?.header?.delete">
            <a class="remove" href="javascript:void(0)" (click)="remove(row)" title="Remove"><i
                    class="fa fa-trash"></i></a>
        </td>
        <td>
            <a *ngIf="row?.isLocked" href="javascript:void(0)"><i class="fa fa-lock"></i></a>
        </td>
    </tr>
    <ng-template ngFor let-childRow [ngForOf]="row?.children" let-j="index">
        <ng-container [ngTemplateOutlet]="groupRow" [ngTemplateOutletContext]="{ row:childRow, level: level+1, isChild: true}"></ng-container>
    </ng-template>
</ng-template>
