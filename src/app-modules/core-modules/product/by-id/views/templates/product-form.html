<ng-template #actionTemplate>
    <ul class="nav nav-xs flex-row no-border">
        <li class="nav-item mr-2">
            <button class="btn btn-sm btn-outline border text-theme b-theme"><i class="fa fa-hand-grab-o  pr-2"></i>Activities</button>
        </li>
    </ul>
</ng-template>
<div class="d-flex flex">
    <div class="d-flex flex white lt box-shadow mx-3 mt-3">
        <div class="d-flex flex-column flex">
            <div class="navbar flex-nowrap white lt box-shadow">
                <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                    <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span></a>
                <span class="text-md text-ellipsis flex">Product/ Service</span>
            </div>
            <div class="scrollable hover">
                <div class="p-3">
                    <form [formGroup]="customForm" class="flex">
                        <div class="row d-flex">
                            <div class="col-sm-9">
                                <div class="md-form-group float-label">
                                    <input class="md-input" formControlName="name"
                                           [ngClass]="{ 'is-invalid': submitted && f.name.errors }">
                                    <label>Name</label>
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="md-form-group float-label"><input class="md-input"
                                                                              formControlName="code"><label>
                                    Code </label></div>
                            </div>
                            <div class="col-sm-12">
                                <div class="md-form-group float-label">
                                    <textarea class="md-input" rows="2" formControlName="description"></textarea>
                                    <label> Description </label>
                                </div>
                            </div>
                            <div class="col-sm-12">
                                <select-dropdown [items]="apiResolver?.masterType?.taxMapper"
                                                 title="Tax" (cb)="updateTaxMapper($event)"
                                                 [control]="formProductTaxMapperId"></select-dropdown>
                            </div>
                            <div class="col-sm-12">
                                <h6 class="text-xs">Category</h6>
                                <div class="list text-xs" formArrayName="categories">
                                    <ng-template ngFor let-category [ngForOf]="formCategories?.controls" let-i="index">
                                        <div class="float-left m-0" [formGroup]="category">
                                            <label class="ui-check m-1 mx-0">
                                                <input type="checkbox" formControlName="categoryId"><i></i>
                                                {{category.get('name').value}}
                                            </label>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="box-body box">
                                    <div class="row pb-3">
                                        <div class="col-sm-3"><h6 class="text-xs py-1">Nature Type</h6></div>
                                        <div class="col-sm-9">
                                            <div class="list text-xs">
                                                <ng-template ngFor let-nature [ngForOf]="apiResolver?.masterType?.supplyNature" let-i="index">
                                                    <div class="float-left p-0">
                                                        <label class="ui-check m-1 mx-0">
                                                            <input type="radio" [value]="nature.masterType" name="nature" formControlName="nature"><i></i>
                                                            {{nature.name}}
                                                        </label>
                                                    </div>
                                                </ng-template>
                                            </div>
                                        </div>
                                        <div class="col-sm-3"><h6 class="text-xs py-1">Product Type</h6></div>
                                        <div class="col-sm-9">
                                            <div class="list text-xs">
                                                <ng-template ngFor let-productType [ngForOf]="productTypes" let-i="index">
                                                    <div class="float-left p-0">
                                                        <div class="m-0">
                                                            <label class="ui-check m-1 mx-0">
                                                                <input type="radio" [value]="productType.id" name="productTypeId" formControlName="productTypeId"><i></i>
                                                                {{productType.name}}
                                                            </label>
                                                        </div>
                                                    </div>
                                                </ng-template>
                                            </div>
                                        </div>
                                        <div class="col-sm-3"><h6 class="text-xs py-1">Procurement Type</h6></div>
                                        <div class="col-sm-9">
                                            <div class="list text-xs">
                                                <ng-template ngFor let-procurementType
                                                             [ngForOf]="apiResolver?.masterType?.procurementTypes"
                                                             let-i="index">
                                                    <div class="float-left p-0">
                                                        <label class="ui-check m-1 mx-0">
                                                            <input type="radio" [value]="procurementType.id" name="procurementTypeId" formControlName="procurementTypeId"><i></i>
                                                            {{procurementType.name}}
                                                        </label>
                                                    </div>
                                                </ng-template>
                                            </div>
                                        </div>
                                        <div class="col-sm-3"><h6 class="text-xs py-1">Supply Type</h6></div>
                                        <div class="col-sm-9">
                                            <div class="list text-xs">
                                                <ng-template ngFor let-supplyType
                                                             [ngForOf]="apiResolver?.masterType?.supplyTypes"
                                                             let-i="index">
                                                    <div class="float-left p-0">
                                                        <label class="ui-check m-1 mx-0">
                                                            <input type="radio" [value]="supplyType.id" name="supplyTypeId" formControlName="supplyTypeId"><i></i>
                                                            {{supplyType.name}}
                                                        </label>
                                                    </div>
                                                </ng-template>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row pb-3">
                                        <!--<div class="col-sm-6">
                                            <h6 class="text-xs float-left">Category</h6>
                                            <div class="float-right">
                                                <slider-dropdown [data]="apiResolver?.masterType?.categories"
                                                                 (cb)="updateCatetgories($event)"
                                                                 [options]="options" [parentId]=""
                                                                 [childId]=""></slider-dropdown>
                                            </div>
                                        </div>-->

                                    </div>
                                    <!--<div class="line line-dashed b-b mb-3"></div>
                                   <div class="row">
                                        <div class="col-sm-6">
                                            <select-dropdown [items]="apiResolver?.masterType?.brands"
                                                             title="Brand"
                                                             [contentTemplate]="addBrandTemplate" addNewEnabled="true"
                                                             (cb)="updateProductBrand($event)"
                                                             [control]="formProductBrandId"></select-dropdown>
                                        </div>
                                        <div class="col-sm-6">
                                            <select-dropdown [items]="apiResolver?.masterType?.divisions"
                                                             title="Division"
                                                             addNewEnabled="true"
                                                             (cb)="updateProductDivision($event)"
                                                             [control]="formProductDivisionId"></select-dropdown>
                                        </div>
                                    </div>
                                    <div class="line line-dashed b-b mb-3"></div>-->
                                </div>
                            </div>
                            <!--<variant-grid [productId]="id"></variant-grid>-->
                        </div>
                    </form>
                </div>
            </div>
            <div class="p-3 white lt b-t mt-auto text-center">
                <button (click)="onSubmit(customForm)" class="btn btn-sm btn-outline border text-theme b-theme"
                        [disabled]="!customForm.valid || submitted">
                    <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i> {{ submitted ? 'Submitting...' : actionType }} Product
                </button>
            </div>
        </div>
    </div>
    <div class="d-flex flex">
        <div class="d-flex flex-column flex mx-3 mt-3">
            <div class="row d-flex pb-3">
                <div class="col-sm-12">
                    <form class="dropzone white b-a b-1x b-dashed b-primary p-a rounded text-center dz-clickable"
                          data-plugin="dropzone" data-option="{url: 'api/dropzone'}">
                        <div class="dz-message"><h4 class="my-4">Drop files here or click to upload.</h4>
                            <span class="text-muted d-block mb-4">You can add up to 15 images, each not exceeding <strong>5 MB</strong>. </span>
                        </div>
                    </form>
                </div>
            </div>
            <div class="scrollable hover">
                <!--<variant-grid [productId]="id"></variant-grid>-->
            </div>
        </div>
    </div>
</div>
<ng-template #addBrandTemplate>
    <add-brand (cb)="brandCallback($event)"></add-brand>
</ng-template>
