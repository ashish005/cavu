<div *ngIf="showHeader" class="navbar no-radius box-shadow" >
    <h6>{{header.text}}</h6>
    <ng-template ngFor let-row [ngForOf]="header?.options" let-i="index">
        <a class="btn btn-sm btn-outline border text-theme b-theme float-right" (click)="applyEvent(row.event)">{{row.name}}</a>
    </ng-template>
</div>
<div class="d-flex flex scroll-y">
    <div class="d-flex flex-column flex lt mb-0 bg-transparent">
        <div class="scroll-y">
            <org-grid [data]="gridData"
                      [options]="gridOptions"
                      [isLoading]="isLoading"
                      (cb)="actionCb($event)"
                      (update)="updateGrid($event)"></org-grid>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total"
                                 [perPage]="coreState?.take"
                                 [page]="coreState?.page"
                                 (cb)="moveToPage($event)"></org-grid-pagination>
        </div>
    </div>
</div>
