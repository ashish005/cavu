<div class="d-flex flex">
    <div class="fade aside aside-sm">
        <div class="d-flex flex-column w-xl b-r white modal-dialog">
            <!--<div class="navbar box-shadow">
                <div class="input-group flex">
                    <input type="text" class="form-control px-0 no-bg no-border no-shadow search" placeholder="Search" required="">
                    <span class="input-group-btn">
                        <button class="btn no-bg no-border no-shadow" type="button"><i class="fa fa-search text-muted"></i></button>
                    </span>
                </div>
            </div>-->
            <div class="p-2 px-3 text-muted text-sm">Account Group</div>
            <account-group-tree isPopup="true" (onOk)="showLedgerDetails($event)"></account-group-tree>
            <!--<div class="p-3 mt-auto"><span class="text-sm text-muted"></span></div>-->
        </div>
    </div>
    <div class="d-flex flex">
        <div class="d-flex flex-column flex">
            <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
                <div class="d-flex flex-column flex">
                    <org-grid [data]="gridData"
                              [isLoading]="isLoading"
                              [options]="gridOptions"
                              (cb)="actionCb($event)"
                              (update)="updateGridData($event)"></org-grid>
                </div>
            </div>
            <div class="mt-auto">
                <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take"
                                     [page]="coreState?.page"
                                     (cb)="moveToPage($event)"></org-grid-pagination>
            </div>
        </div>
    </div>
</div>
