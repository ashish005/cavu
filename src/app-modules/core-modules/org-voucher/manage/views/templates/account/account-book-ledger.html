<div class="d-flex flex">
    <div class="fade aside aside-sm d-print-none">
        <div class="d-flex flex-column w-xl b-r white modal-dialog">
            <div class="navbar box-shadow">
                <div class="input-group flex">
                    <input type="text" class="form-control px-0 no-bg no-border no-shadow search" placeholder="Search" required="">
                    <span class="input-group-btn"><button class="btn no-bg no-border no-shadow" type="button"><i class="fa fa-search text-muted"></i></button></span>
                </div>
            </div>
            <div class="scrollable hover">
                <div class="list inset">
                    <div class="p-2 px-3 text-muted text-sm">Vouchers</div>
                    <ng-template ngFor let-row [ngForOf]="gridData" let-i="index">
                        <div class="list-item">
                            <div class="list-body">
                                <a class="item-title _500" data-pjax-state="">{{row.voucherNo}}</a>
                                <div class="item-except text-sm text-muted h-1x"> ( {{row?.voucherType}} ) {{row?.voucherDate }}</div>
                                <div class="item-except text-sm text-muted h-1x">
                                    <span class="d-block ">C: {{row?.credit | orgCurrency}}</span>
                                    <span class="d-block text-center">D: {{row?.debit | orgCurrency}}</span>
                                    <span class="d-block text-right">B: {{row?.balance | orgCurrency}}</span>
                                </div>
                                <div class="item-tag tag hide"></div>
                            </div>
                            <div></div>
                        </div>
                    </ng-template>
                </div>
                <div class="no-result hide">
                    <div class="p-4 text-center">No Results</div>
                </div>
            </div>
            <div class="mt-auto">
                <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)"></org-grid-pagination>
            </div>
        </div>
    </div>
    <div class="d-flex flex">
        <div class="d-flex flex-column flex">
            <div class="navbar flex-nowrap white lt box-shadow">
                <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none" data-pjax-state="">
                    <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span>
                </a>
                <span class="text-md text-ellipsis flex">Voucher Detail</span>
            </div>
            <div class="d-flex flex">
                <!--<finance-report [data]="gridRow"></finance-report>-->
            </div>
        </div>
    </div>
</div>
