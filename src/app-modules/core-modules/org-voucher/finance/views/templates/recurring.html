<ng-template #pageTitleTemplate><span class="navbar-text"><i class="fa fa-repeat mr-1"></i><b>Recurring invoices and bills</b></span></ng-template>
<ng-template #actionTemplate></ng-template>

<div class="d-flex flex-column flex">
    <div class="px-3 pt-2 text-sm text-muted">To start a schedule, open an invoice or bill and choose <b>Repeat</b>. Copies are issued on their date; with auto-post they are posted at once, otherwise they wait as drafts.</div>
    <div class="d-flex px-2 pt-2"><input class="form-control form-control-sm mb-2" style="max-width: 240px" [(ngModel)]="coreState.search" (keyup.enter)="populateGrid()" placeholder="Schedule name"></div>
    <div *ngIf="errorText && !isLoading" class="alert alert-danger m-2">{{ errorText }}</div>
    <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent"><org-grid [data]="gridData" [options]="gridOptions" [isLoading]="isLoading" (cb)="actionCb($event)"></org-grid></div>
    <div class="mt-auto"><org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)"></org-grid-pagination></div>
</div>

<app-aside *ngIf="form as f" size="md" [title]="f.row.name" [subtitle]="f.row.kind + ' ' + f.row.templateNumber + ' · ' + f.row.partyName" (closed)="form = null">
    <loader [isLoading]="saving"></loader>
    <div *ngIf="formError" class="alert alert-danger text-sm py-2">{{ formError }}</div>
    <div class="form-group"><label class="text-sm _600">Name</label><input class="form-control" [(ngModel)]="f.model.name" maxlength="150"></div>
    <div class="row">
        <div class="col-6 form-group"><label class="text-sm _600">Every</label>
            <div class="d-flex"><input type="number" class="form-control mr-1" style="width: 70px" [(ngModel)]="f.model.interval" min="1" max="24">
                <select class="form-control" [(ngModel)]="f.model.frequency"><option value="Weekly">week(s)</option><option value="Monthly">month(s)</option><option value="Quarterly">quarter(s)</option><option value="Yearly">year(s)</option></select></div></div>
        <div class="col-6 form-group"><label class="text-sm _600">Next copy</label><input type="date" class="form-control" [(ngModel)]="f.model.nextRunDate"></div>
        <div class="col-6 form-group"><label class="text-sm _600">End date</label><input type="date" class="form-control" [(ngModel)]="f.model.endDate"></div>
        <div class="col-6 form-group"><label class="text-sm _600">Copies left</label><input type="number" class="form-control" [(ngModel)]="f.model.remainingCount" min="1" placeholder="No limit"></div>
    </div>
    <label class="text-sm mr-3"><input type="checkbox" class="mr-1" [(ngModel)]="f.model.autoPost">Post automatically</label>
    <label class="text-sm"><input type="checkbox" class="mr-1" [(ngModel)]="f.model.isPaused">Paused</label>
    <div *ngIf="f.row.lastRunAt" class="text-xs text-muted mt-2">Last run {{ f.row.lastRunAt | date:'medium' }}<span *ngIf="f.row.lastError" class="text-danger"> · {{ f.row.lastError }}</span></div>
    <div class="d-flex mt-3">
        <button class="btn white text-danger" (click)="remove()">Remove</button>
        <button class="btn white ml-1" (click)="runNow()" title="Issue the next copy now">Issue now</button>
        <span class="flex"></span>
        <button class="btn white mr-1" (click)="form = null">Cancel</button><button class="btn theme" (click)="save()">Save</button>
    </div>
</app-aside>
