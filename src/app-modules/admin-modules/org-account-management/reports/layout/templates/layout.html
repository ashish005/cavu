<div class="app-content" role="main">
    <div class="content-header m-auto">
        <report-search #searchComp (onOk)="searchActionCb($event)"></report-search>
    </div>
    <div class="content-main d-flex flex">
        <div class="d-flex flex">
            <div class="fade aside aside-sm" id="content-aside">
                <div class="d-flex flex-column w-md light lt">
                    <!--<div class="px-3 text-muted text-sm"></div>
                    <a class="nav-link"><span class="btn btn-sm btn-block btn-rounded theme" (click)="createNew()">
                        <i class="fa fa-plus float-left"></i>New Voucher</span>
                    </a>-->
                    <div class="scrollable hover">
                        <div class="list-group list-group-gap p-2">
                            <ng-template ngFor let-nav [ngForOf]="asideData?.navList | sortBy:'asc': 'sortOrder'" let-i="index">
                                <div class="p-2 px-3">
                                    <span class="text-muted text-sm">{{nav.name}}</span>
                                </div>
                                <ng-template ngFor let-item [ngForOf]="nav.children | sortBy:'asc': 'sortOrder'">
                                    <a class="list-group-item p-0 px-2" [routerLink]="item.routeTo" routerLinkActive="active">
                                        <span class="float-right py-1"><i class="fa fa-chevron-right"></i></span>
                                        <span class="nav-text py-1"><i [class]="item.icon" class="pr-2"></i>{{item.name}}</span>
                                    </a>
                                </ng-template>
                            </ng-template>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex">
                <div class="d-flex flex-column flex">
                    <div class="navbar flex-nowrap lt">
                        <div class="no-shadow">
                            <h6 class="mb-0"> {{page?.title}} </h6>
                            <!--<small class="float-left"> Management</small>-->
                        </div>
                    </div>
                    <div class="px-3 d-flex flex scroll-y">
                        <router-outlet (activate)='onActivate($event)'></router-outlet>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> Financial Report </h6>
        <small class="float-left"><i></i> Management</small>
    </div>
</ng-template>
<ng-template #actionTemplate>

</ng-template>
