<ng-template #actionTemplate>
    <ul class="nav">
        <li class="nav-item mr-2">
            <button class="btn btn-sm btn-block btn-rounded theme">
                <i class="fa fa-plus pr-2"></i> New {{ pageTitle  }}
            </button>
        </li>
    </ul>
</ng-template>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> {{ pageTitle  }} </h6>
        <small class="float-left"><i [class]="pageIcon"></i> Management</small>
    </div>
</ng-template>
<div class="content-main d-flex flex" id="content-main">
    <div class="d-flex flex" data-plugin="chat">
        <div class="fade aside aside-sm" id="content-aside">
            <bank (cb)="bankClick($event)" (addAccount)="createNewAccount($event)"></bank>
        </div>
        <div class="d-flex flex" id="content-body">
            <div class="d-flex flex-column flex">
                <div class="navbar flex-nowrap white lt box-shadow">
                    <div class="no-shadow">
                        <h6 class="mb-0"> {{ pageTitle  }} </h6>
                        <small class="float-left"><i [class]="pageIcon"></i> Management</small>
                    </div>
                </div>
                <div class="d-flex flex">
                    <div class="d-flex flex-column flex">
                        <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
                            <org-grid [data]="gridData"
                                      [options]="gridOptions"
                                      [isLoading]="isLoading"
                                      (cb)="actionCb($event)"
                                      (update)="updateGrid($event)"></org-grid>
                        </div>
                        <div class="mt-auto">
                            <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page" (cb)="moveToPage($event)">
                            </org-grid-pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
