<div class="app-content box-shadow-0" role="main">
    <div class="content-main d-flex flex">
        <div class="d-flex flex">
            <div class="d-flex flex-column flex">
                <div class="navbar flex-nowrap white lt box-shadow">
                    <a data-toggle="modal" data-target="#content-aside"
                       data-modal="" class="mr-1 d-md-none"
                       data-pjax-state=""><span
                            class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span></a>
                    <span
                            class="text-md text-ellipsis flex">{{ pageTitle  }}</span>
                    <ul class="nav nav-xs flex-row no-border" *ngIf="systemType?.masterType != 'all'">
                        <li class="nav-item mr-2">
                            <button class="btn btn-sm btn-block btn-rounded theme" (click)="createNew()">
                                <i class="fa fa-plus pr-2"></i> New {{ pageTitle  }}
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
                    <org-grid [data]="gridData"
                              [options]="gridOptions"
                              [isLoading]="isLoading"
                              (cb)="actionCb($event)"
                              (update)="updateGrid($event)"></org-grid>
                </div>
                <div class="mt-auto">
                    <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                                         (cb)="moveToPage($event)">
                    </org-grid-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
