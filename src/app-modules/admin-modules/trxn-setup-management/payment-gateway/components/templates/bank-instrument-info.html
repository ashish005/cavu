<div class="content-main d-flex flex">
    <div class="d-flex flex" data-plugin="user">
        <div class="d-flex flex-column w-md" *ngIf="isBank">
            <span class="p-1 text-muted">Instrument Types</span>
            <div class="scrollable hover px-3">
                <div class="list-group list-group-gap">
                    <ng-template ngFor let-row [ngForOf]="apiResolver.masterType?.bankInstrumentTypes" let-i="index">
                        <a class="list-group-item box p-1 px-2">
                            <span class="float-right"><i class="fa fa-chevron-right"></i></span>
                            {{row.name}}
                        </a>
                    </ng-template>
                </div>
            </div>
            <div class="p-3 mt-auto"><span class="text-sm text-muted"></span></div>
        </div>
        <div class="d-flex flex">
            <div class="d-flex flex-column flex">
                <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
                    <org-grid [data]="gridData"
                              [options]="gridOptions"
                              [isLoading]="isLoading"
                              (cb)="actionCb($event)"
                              (update)="updateGrid($event)"></org-grid>
                </div>
                <div class="mt-auto">
                    <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                                         (cb)="moveToPage($event)">
                    </org-grid-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
