<div class="d-flex flex-column flex scroll-y"><div class="container-fluid p-3" style="max-width: 1200px">
<loader [isLoading]="loading || saving"></loader>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
<p class="text-sm text-muted">Choose how you hear about things. Some notifications are set by your organisation and cannot be changed here.</p>
<div *ngIf="!loading && !items.length" class="text-center text-muted p-4">There is nothing for you to choose.</div>
<div *ngFor="let a of areas; trackBy: trackByArea" class="mb-3">
    <div class="text-xs text-muted text-uppercase _600 mb-1">{{ a.area }}</div>
    <div class="box mb-0">
        <div *ngFor="let i of a.items; trackBy: trackByCode" class="d-flex flex-wrap align-items-center p-3 b-b">
            <div class="flex" style="min-width: 220px">
                <div class="_600">{{ i.name }}</div>
                <div class="text-xs text-muted">{{ i.description }}</div>
                <div *ngIf="i.locked" class="text-xs text-muted"><i class="fa fa-lock mr-1"></i>{{ i.lockedReason }}</div>
            </div>
            <label *ngFor="let c of i.channels" class="mb-0 ml-3 text-sm" [class.text-muted]="i.locked">
                <input type="checkbox" class="mr-1" [(ngModel)]="c.isEnabled" [disabled]="i.locked" (ngModelChange)="dirty = true">
                <i class="fa fa-fw" [ngClass]="icon[c.channel]"></i>{{ channelLabel[c.channel] }}
            </label>
        </div>
    </div>
</div>
<button *ngIf="items.length" class="btn theme" [disabled]="saving || !dirty" (click)="save()">Save my choices</button>
</div></div>
