<div class="d-flex flex">
    <div class="d-flex flex-column flex">
        <div *ngIf="errorMsg && !isLoading" class="alert alert-danger d-flex align-items-center m-2">
            <span class="flex">Could not load records. Please try again.</span>
            <button class="btn btn-sm white" (click)="refreshGrid()">Retry</button>
        </div>
        <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
            <org-grid [data]="gridData"
                      [options]="gridOptions"
                      [isLoading]="isLoading"
                      (cb)="actionCb($event)"
                      (update)="updateGrid($event)"></org-grid>
        </div>
        <div class="mt-auto">
            <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                                 (cb)="moveToPage($event)">
            </org-grid-pagination>
        </div>
    </div>
</div>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0">{{ pageTitle }}</h6>
        <small class="text-muted"><i [class]="pageIcon"></i> Subscription</small>
    </div>
</ng-template>
<ng-template #actionTemplate>
    <button class="btn btn-sm white" [disabled]="isLoading" (click)="refreshGrid()" title="Refresh">
        <i class="fa fa-refresh" [class.fa-spin]="isLoading"></i>
    </button>
</ng-template>
