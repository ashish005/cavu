<div class="app" id="app">
    <div id="content" class="app-content box-shadow-0" role="main">
        <div class="content-main d-flex flex">
            <router-outlet (activate)='onActivate($event)'></router-outlet>
        </div>
    </div>
</div>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> Org Setup</h6>
        <small class="float-left"> Management</small>
    </div>
</ng-template>
<ng-template #actionTemplate>
    <div class="nav-active-border b-theme px-4 px-md-0">
        <ul class="nav nav-xs flex-row">
            <li class="nav-item"><a class="nav-link" [routerLink]="['general']" routerLinkActive="active">General</a></li>
            <li class="nav-item"><a class="nav-link" [routerLink]="['config']" routerLinkActive="active">Config</a></li>
            <li class="nav-item"><a class="nav-link" [routerLink]="['features']" routerLinkActive="active">Features</a></li>
        </ul>
    </div>
</ng-template>
