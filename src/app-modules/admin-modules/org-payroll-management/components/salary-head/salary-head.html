<div class="box">
  <div class="box-header"><a class="float-right text-muted text-sm">See detail</a>
    <h3>{{title}}</h3>
  </div>
  <div class="box-body">
    <responsive-table [options]="gridOptions" [data]="data"></responsive-table>
  </div>
  <div class="box-footer">
    <small class="text-muted">Tip: All data calculated in real time</small>
  </div>
  <loader [isLoading]="isLoading" [count]="count"></loader>
</div>
