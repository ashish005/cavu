<div class="app">
    <org-aside [data]="navList"></org-aside>
    <div id="content" class="app-content">
        <div class="navbar flex-nowrap white lt box-shadow">
            <a data-toggle="modal" data-target="#content-aside" data-modal="" class="mr-1 d-md-none">
                <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
            </a>
            <ng-template *ngTemplateOutlet="pageTitleTemplate"></ng-template>
            <ng-template *ngTemplateOutlet="actionTemplate"></ng-template>
        </div>
        <div class="pl-3 pr-3 py-2"><app-breadcrumb></app-breadcrumb></div>
        <div id="content-main" class="content-main d-flex flex">
            <div class="d-flex flex" data-plugin="mail">
                <div class="fade aside aside-sm" id="content-aside">
                    <div class="modal-dialog d-flex flex-column w-md">
                        <a class="nav-link" (click)="createTaxCategory()"><span
                                class="btn btn-sm btn-block btn-rounded theme">
                        <i class="fa fa-plus float-left"></i> New Tax Category</span>
                        </a>
                        <div class="px-2">
                            <span class="text-muted">Taxes</span>
                            <a class="text-primary text-theme item-title _500 float-right"
                               (click)="showAllTaxRates($event)">All Tax Rates </a>
                        </div>
                        <div class="scrollable hover px-3 py-2">
                            <div class="list-group box text-xs _500">
                                <ng-template ngFor let-taxType
                                             [ngForOf]="apiResolver?.masterType?.taxTypes | sortBy:'asc': 'sortOrder'"
                                             let-i="index">
                                    <a class="list-group-item py-1">
                                        {{taxType?.name }}
                                    </a>
                                </ng-template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex flex">
                    <div class="d-flex flex-column flex">
                        <ng-template *ngTemplateOutlet="pageLayoutTitleTemplate"></ng-template>
                        <router-outlet (activate)='onActivate($event)'></router-outlet>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #pageTitleTemplate>
    <div class="no-shadow">
        <h6 class="mb-0"> Tax Management </h6>
        <small class="float-left"> Management</small>
    </div>
</ng-template>
<ng-template #actionTemplate>
    <ng-template *ngTemplateOutlet="actionLayoutTemplate"></ng-template>
</ng-template>
