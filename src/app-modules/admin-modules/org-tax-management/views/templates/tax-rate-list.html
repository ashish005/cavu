<div class="d-flex flex-column w-100 h-100">
  <div class="b-b text-center text-sm-right">
    <div class="nav-active-border b-warning bottom box mb-0">
      <div class="nav nav-md">
        <a class="nav-link text-center" [class.active]="!coreState.taxGroupId" (click)="changeByTaxGroup(null)">All</a>
        <ng-template ngFor let-taxGroup [ngForOf]="apiResolver.masterType.taxGroups" let-i="index">
          <a class="nav-link text-center" (click)="changeByTaxGroup(taxGroup.id)">{{taxGroup?.name}}</a>
        </ng-template>
      </div>
    </div>
  </div>
  <div class="box mb-0">
    <div class="box-header p-2 theme">
      <a class="item-title _500">{{gridOptions?.header?.title}}</a>
      <small class="mt-0">{{gridOptions?.header?.desc}}</small>
    </div>
    <box-tool [options]="gridOptions?.header" (cb)="boxToolCallback($event)"></box-tool>
  </div>
  <div class="d-flex flex">
    <div class="d-flex flex-column flex">
      <div class="scroll-y d-flex flex-column flex box mb-0 bg-transparent">
        <org-grid [data]="gridData"
                  [options]="gridOptions"
                  [isLoading]="isLoading"
                  (cb)="actionCb($event)"
                  (update)="updateGrid($event)"></org-grid>
      </div>
      <div class="b-t mt-auto" *ngIf="gridOptions?.total>coreState?.take">
        <org-grid-pagination [count]="gridOptions?.total" [perPage]="coreState?.take" [page]="coreState?.page"
                             (cb)="moveToPage($event)">
        </org-grid-pagination>
      </div>
    </div>
  </div>
</div>
