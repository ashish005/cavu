<div class="card">
    <div class="header">
        <p class="lead text-xs">Recover my password</p>
    </div>
    <div class="body">
        <p class="text-sm _500 text-muted">Please enter your email address below to receive instructions for resetting password.</p>
        <form class="form-auth-small" [formGroup]="customForm" (submit)="submitForm(customForm)">
            <div class="form-group">
                <input type="email" class="form-control" formControlName="email" placeholder="E-mail">
            </div>
            <button type="submit" class="btn btn-primary btn-sm btn-block" [disabled]="!customForm.valid">
                <i *ngIf="submitted" class='fa fa-circle-o-notch fa-spin'></i>
                {{ submitted ? 'Submitting...' : 'Reset Password' }}
            </button>
            <div class="bottom">
                <div class="helper-text text-sm"><span class="text-muted px-2">Know your password?</span> <a class="text-primary text-sm _500" [routerLink]="['/login']">Login</a></div>
            </div>
        </form>
    </div>
</div>
