<div class="card">
  <div class="header">
    <p class="lead">Create an account</p>
  </div>
  <div class="body">
    <form class="form-auth-small" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="control-label sr-only" for="name">Name</label>
        <input type="text" formControlName="name" placeholder="Full Name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
        <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
          <div *ngIf="f['name'].errors['required']">Name is required</div>
        </div>
      </div>
      <div class="form-group">
        <label class="control-label sr-only" for="email">Email:</label>
        <input type="text" formControlName="email" placeholder="Enter email" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <div *ngIf="f['email'].errors['required']">Email is required</div>
        </div>
      </div>
      <div class="form-group">
        <label class="control-label sr-only" for="mobile">Mobile No:</label>
        <input type="text" formControlName="mobile" placeholder="Enter mobile no" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['mobile'].errors }" />
        <div *ngIf="submitted && f['mobile'].errors" class="invalid-feedback">
          <div *ngIf="f['mobile'].errors['required']">Mobile is required</div>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div class="form-group">
        <label class="control-label sr-only" for="username">Username</label>
        <input type="text" formControlName="username" placeholder="Enter user name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['username'].errors }" />
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Username is required</div>
        </div>
      </div>
      <div class="form-group">
        <label class="control-label sr-only" for="password">Password</label>
        <input type="password" formControlName="password" placeholder="Enter password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-sm btn-block">Register</button>
    </form>
  </div>
</div>
