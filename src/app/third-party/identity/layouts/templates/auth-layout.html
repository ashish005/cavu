            <svg height="30" width="60">

                    <text x="10" y="30" fill="#124f7acc">Rator</text>

<div class="app">
    <div id="content" class="app-content box-shadow-1 box-radius-1" role="main">
        <div class="content-main d-flex flex" id="content-main">
            <div id="wrapper" class="container">
                <div class="row no-gutters">
                    <div class="col-sm-7">
                        <div class="auth_detail" style="color: #004f7e; opacity: 0.7;">
                            <h3 class="text-monospace"> {{app?.software?.name || 'Business Accounting & Tax
                                Management System'}} </h3>
                            <p class="p-3">{{app?.software?.description || 'A Cloud-based app to manage business
                                finances'}} </p>
                        </div>
                    </div>
                    <div class="col-sm-5">
                        <router-outlet (activate)='onActivate($event)'></router-outlet>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
