<div class="row">
    <div class="col-md-4 no-border-sm">
        <file-uploader (cb)="uploadAs($event)"></file-uploader>
    </div>
    <div class="col-md-8 no-border-sm">
        <ng-template *ngTemplateOutlet="documentsGrid"></ng-template>
    </div>
</div>
<ng-template #documentsGrid>
    <div class="row">
        <div class="col-sm-12">
            <table class="table">
                <thead>
                <tr>
                    <th>Image</th>
                    <th>Doc Type</th>
                    <th>Category</th>
                    <th>Count</th>
                    <th>Size</th>
                    <th>Verification</th>
                    <th>Status</th>
                    <th width="120px">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let item of documents">
                    <td class="p-1">
                        <!--<div *ngFor="let d of item?.docs">
                            <img class="thumb float-left mr-2" [src]="d?.fileUrl" style="height: 50px;width: 50px;">
                        </div>-->
                        <div class="user-group user-group--bordered">
                            <ng-template ngFor let-d [ngForOf]="item?.docs" let-j="index">
                                <div class="user user--rounded"><img [src]="d?.fileUrl" class="circle b-a"
                                                                     style="height: 30px;width: 30px;"></div>
                            </ng-template>
                        </div>
                        <!--<div class="thumb float-left" thumb-preview [src]="item" style="height: 50px;width: 50px;" (mouseover)="updateActiveImg(item)"></div>
                        <div class="thumb ml-2 float-left" thumb-preview [src]="item" style="height: 50px;width: 50px;" (mouseover)="updateActiveImg(item)"></div>-->
                    </td>
                    <td>
                        {{ item?.documentTypeName }}
                        <small *ngIf="item.isMandatory" class="badge badge-pill danger up text-xs">Mandatory</small>
                    </td>
                    <td> {{ item?.documentCategoryName }}</td>
                    <td> {{item?.count}}</td>
                    <td nowrap> {{item?.size/1024/1024 | number}} MB</td>
                    <td>
                        <span *ngIf="item.isVerificationRequired">Pending...</span>
                        <span *ngIf="item.isVerificationRequired">{{item.verificationBy}}</span>
                    </td>
                    <td>
                        {{item?.status}}
<!--                        <span *ngIf="item?.isSuccess"><i class="glyphicon glyphicon-ok"></i></span>-->
<!--                        <span *ngIf="item?.isCancel"><i class="glyphicon glyphicon-ban-circle"></i></span>-->
<!--                        <span *ngIf="item?.isError"><i class="glyphicon glyphicon-remove"></i></span>-->
                    </td>
                    <td nowrap>
                        <div class="text-sm text-muted">
                            <ul class="nav nav-sm float-right">
                                <li class="nav-item b-r">
                                        <span class="btn btn-xs btn-outline" title="Download"><i
                                                class="fa fa-download"></i></span>
                                </li>
                                <li class="nav-item">
                                        <span class="btn btn-xs btn-outline" title="Edit"><i
                                                class="fa fa-edit"></i></span>
                                </li>
                                <li class="nav-item b-l">
                                    <span class="btn btn-xs btn-outline" title="Remove"><i
                                            class="fa fa-remove"></i></span>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <!--<div>
              <div class="pb-4">
                Queue progress:
                <div class="progress" style="">
                  <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': progress + '%' }"></div>
                </div>
              </div>
              <button type="button" class="btn btn-success btn-s">
                <span class="glyphicon glyphicon-upload"></span> Upload all
              </button>
              <button type="button" class="btn btn-warning btn-s">
                <span class="glyphicon glyphicon-ban-circle"></span> Cancel all
              </button>
            </div>-->
        </div>
    </div>
</ng-template>
