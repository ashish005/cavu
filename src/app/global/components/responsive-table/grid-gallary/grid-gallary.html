<div>
  <div class="row row-sm">
    <div class="col-12 col-lg-3" *ngFor="let row of data; let i = index">
      <div class="list-item box r mb-2">
        <a class="d-flex p-0">
          <span class="avatar w-40 grey hide"></span>
          <e-img [profileUrl]="row?.profileUrl"></e-img>
        </a>
        <div class="list-body">
          <div class="text-ellipsis">
            <a (click)="editInfo(row)"> {{ row?.name }}</a>
            <small class="text-muted text-ellipsis float-right">
              {{ row.bloodGroup }}
            </small>
          </div>
          <small class="text-muted text-ellipsis">
            <span>{{ row.registrationNo }}</span>
            <!--<span class="pl-2"><i class="fa fa-birthday-cake" aria-hidden="true"></i> {{ row.birthday }}</span>-->
          </small>
          <small class="text-muted">
            <span><i class="fa fa-envelope" aria-hidden="true"></i> {{ row.email }}</span>
          </small>
        </div>
      </div>
    </div>
  </div>
  <!--<div class="row">
    <div class="col-md-12">
      <div class="row row-xs">
        <div class="col-6 col-sm-3 col-md-2" *ngFor="let row of data; let i = index">
          <div class="box p-1"><a href="#"  *ngIf="row?.profileImg"><img [src]="row?.fileUrl" alt="Profile Pic" class="w-100"></a>
            <div class="p-2">
              <div class="text-ellipsis">{{ row.fullName }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>-->
</div>
