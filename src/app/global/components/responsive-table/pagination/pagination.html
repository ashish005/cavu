<div class="mt-auto" [className]="'mt-auto ' + padding" [ngClass]="{'b-t': (true == hasTopBorder) }">
  <div class="d-flex align-items-center">
    <div class="flex">
      <div class="float-left pagination-detail">
      <span class="page-list v-middle">
          <span class="btn-group dropup">
            <button type="button" class="btn dropdown-toggle btn-xs" data-toggle="dropdown">
              <span class="page-size">{{perPage}}</span>
              <span class="caret"></span>
            </button>
            <ul class="dropdown-menu">
              <li class="dropdown-item" *ngFor="let item of pageSizes" (click)="onPageNoSelect(item)"
                  [ngClass]="{'active': item === perPage}">
                <span>{{item}}</span>
              </li>
            </ul>
          </span>
          <!--<small class="pl-2 pr-2">rows</small>-->
        </span>
      </div>
    </div>
    <div class="font-xs pl-2 pr-2">
      <small class="text-muted py-2 text-center">{{ getMin() }} - {{ getMax() }} of {{count}}</small>
    </div>
    <div>
      <ul class="pagination pagination-xs m-0">
        <li class="page-item" [ngClass]="{'white':(page >1),'text-muted':(page === 1)}">
          <a class="page-link" aria-label="First" (click)="goToPage(1)">First</a>
        </li>
        <li class="page-item" [ngClass]="{'white':(page >1),'text-muted':(page === 1)}">
          <a class="page-link" aria-label="Previous" (click)="goToPage(page-1)">
            <span aria-hidden="true">«</span> <span class="sr-only">Previous</span>
          </a>
        </li>
        <li class="page-item white" *ngFor="let pageNum of getPages()"
            (click)="goToPage(pageNum)"
            [ngClass]="{'active': pageNum === page}">
          <a class="page-link">{{ pageNum }}</a>
        </li>
        <li class="page-item" [ngClass]="{'white':!(lastPage),'text-muted':(lastPage || loading)}">
          <a class="page-link" aria-label="Next" (click)="goToPage(page+1)">
            <span aria-hidden="true">»</span>
            <span class="sr-only">Next</span></a>
        </li>
        <li class="page-item" [ngClass]="{'white':!(lastPage),'text-muted':(lastPage || loading)}">
          <a class="page-link" aria-label="Last" (click)="goToLastPage()">Last</a>
        </li>
      </ul>
    </div>
  </div>
</div>
