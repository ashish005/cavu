<div id="calendar" class="calendar">
    <ng-template #headerTemplate>
        <div class="d-flex flex">
            <div class="flex flex-column">Calendar View
                <small class="item-except text-xs text-muted h-1x">{{startDate}}</small>
            </div>
            <div class="flex-column">
                <select class="float-right" (change)="onChange($event)">
                    <ng-template ngFor let-year [ngForOf]="yearArray" let-i="index">
                        <option [value]="year">{{year}}</option>
                    </ng-template>
                </select>
            </div>
        </div>
    </ng-template>
