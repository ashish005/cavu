<div class="content-main d-flex flex" id="content-main">
    <div class="d-flex flex" data-plugin="chat">
        <div class="d-flex flex" id="content-body">
            <div class="d-flex flex-column flex">
                <div class="navbar flex-nowrap lt box-shadow">
                    <a data-toggle="modal" data-target="#content-aside"
                       data-modal="" class="mr-1 d-md-none"
                       data-pjax-state=""><span
                            class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i> </span></a><span
                        class="text-md text-ellipsis flex">Test Scheduler</span>
                    <ul class="nav nav-xs flex-row no-border">
                        <li class="nav-item">
                            <button class="btn btn-xs white b-a no-shadow" type="button" (click)="getTest()">Show Calendar</button>
                        </li>
                    </ul>
                </div>
                <div class="scrollable hover">
                    <div class="p-3">
                        <scheduler-info #schedulerEl
                                        [hideActionHeader]="true"
                                        [hideActionFooter]="true"
                                        (onOk)="onOkAction($event)"
                                        (onCancel)="onCancelAction($event)"></scheduler-info>
                    </div>
                </div>
                <div class="p-2 m-2 white lt b-a mt-auto text-right">
                    <button class="btn btn-xs white b-a no-shadow" type="button" (click)="getTest()">Show Calendar</button>
                </div>
            </div>
            <div class="d-flex flex-column flex">
                <div class="navbar flex-nowrap white lt box-shadow">
                    <a data-toggle="modal" data-target="#content-aside"
                       data-modal="" class="mr-1 d-md-none"
                       data-pjax-state="">
                        <span class="btn btn-sm btn-icon primary"><i class="fa fa-th"></i></span>
                    </a>
                    <ng-template *ngTemplateOutlet="calendarYear?.headerTemplate"></ng-template>
                </div>
                <div class="scrollable hover">
                    <div class="d-flex flex">
                        <div class="d-flex flex-column flex">
                            <calendar-year #calendarYear></calendar-year>
                        </div>
                    </div>
                    <!--<div class="p-3">
                        <div class="streamline streamline-xs streamline-dotted">
                            <ng-template ngFor let-task [ngForOf]="entities" let-i="index">
                                <div class="sl-item b-info">
                                    <div class="sl-content">
                                        <div class="sl-date text-muted">{{task}}</div>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>-->
                </div>
            </div>
        </div>
    </div>
</div>
