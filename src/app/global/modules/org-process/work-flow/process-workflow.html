<div class="designer">
  <!-- Process Tree -->
  <process-tree
          class="designer-panel process-tree-panel"
          [data]="processTree"
          (select)="onProcessSelected($event)">
  </process-tree>

  <!-- Phase List -->
  <phase-list
          class="designer-panel phase-list-panel"
          [process]="selectedProcess"
          [phases]="phases"
          (select)="onPhaseSelected($event)"
          (edit)="onPhaseEdit($event)" (create)="onPhaseCreate($event)">
  </phase-list>

  <!-- Workflow Canvas -->
  <!--<workflow-canvas
          class="designer-panel canvas-panel"
          [phases]="phases"
          [transitions]="phaseTransitions">
  </workflow-canvas>-->
</div>
