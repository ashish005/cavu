            <li class="tl-header">
                <div class="btn btn-xs" data-toggle-class="timeline-center" data-target=".timeline">Workflow</div>
            </li>

</div>
<ng-template #orgProcessTimelineTemplateRef let-list="list">

    <li class="tl-item" *ngFor="let process  of list | sortBy:'asc': 'sortOrder'; let i = index"
        [class.tl-left]="(i%2 == 0)">
        <div class="tl-wrap b-info" style="float: none;">
            <!--<span class="tl-date text-muted"><i class="fa fa-green text-success">N/A</i></span>-->
            <div class="tl-content box-color b-a text-color block w-xl w-auto-xs mb-0">
                <span class="arrow b-white left pull-top hidden-left"></span>
                <span class="arrow b-white right pull-top visible-left"></span>
                <div style="position: relative;">
                    <div class="text-xs _500">
                        <a class="btn btn-xs text-xs b-theme text-theme border-0" (click)="editProcess(process)"><i class="fa fa-edit"></i></a>
                        {{process?.name}}
                        <a class="text-primary px-2" *ngIf="process.description" [ngbPopover]="process.description" placement="auto"
                           (mouseenter)="p.open()" #p="ngbPopover" (mouseleave)="p.close()">
                            <i class="fa fa-info-circle"></i>
                        </a>
                    </div>
                    <ng-template [ngTemplateOutlet]="processActionsTemplateRef"
                                 [ngTemplateOutletContext]="{ process: process, isParent: true }"></ng-template>
                </div>
                <!--<div>

                    <a class="text-primary collapsed">{{process?.name}}</a>
                    <div style="top: -35px; position: relative;">
                        <ng-template [ngTemplateOutlet]="processActionsTemplateRef"
                                     [ngTemplateOutletContext]="{ process: process, isParent: true }"></ng-template>
                    </div>

                </div>-->
                <ng-template [ngTemplateOutlet]="subProcessTemplateRef"
                             [ngTemplateOutletContext]="{ list: process.childItems }"></ng-template>

                <!--<ng-template [ngTemplateOutlet]="orgProcessTimelineTemplateRef"
                             [ngTemplateOutletContext]="{ list: process.childItems }"></ng-template>-->
            </div>
            <div class="tl-content box-color b-a text-color block w-xl w-auto-xs mb-0" *ngIf="process.tasks?.length">
                <ng-template [ngTemplateOutlet]="taskTemplateRef"
                             [ngTemplateOutletContext]="{ taskList: process.tasks }"></ng-template>
            </div>
            <!--<div class="tl-content box-color block b-a">
                <span class="arrow b-info left pull-top hidden-left"></span>
                <span class="arrow b-info right pull-top visible-left"></span>
                <div class="box-header font-bold primary">{{subProcess.name}}</div>
                <div class="box-divider"></div>
                <div class="box-body text-muted">{{subProcess | json}}</div>
            </div>-->
        </div>
    </li>
    <!--</ng-template>-->

</ng-template>
<ng-template #subProcessTemplateRef let-list="list">
    <div class="streamline streamline-xs streamline-dotted">
        <ng-template ngFor let-subProcess [ngForOf]="list | sortBy:'asc': 'sortOrder'" let-i="index">
            <div class="sl-item b-info">
                <!--<div class="sl-icon">
                    <i class="fa fa-cogs"></i>
                </div>-->
                <div class="sl-content text-xs">
                    <div class="sl-author m-0">
                        <a class="btn btn-xs text-xs b-theme text-theme border-0" (click)="editProcess(subProcess)"><i class="fa fa-edit"></i></a>
                        {{subProcess.name}}
                        <a class="text-primary px-2" *ngIf="subProcess.description" [ngbPopover]="subProcess.description" placement="auto"
                           (mouseenter)="p.open()" #p="ngbPopover" (mouseleave)="p.close()">
                            <i class="fa fa-info-circle"></i>
                        </a>
                        <!--<small class="h-1x">{{subProcess.description}}</small>-->
                    </div>
                    <ng-template [ngTemplateOutlet]="processActionsTemplateRef"
                                 [ngTemplateOutletContext]="{ process: subProcess }"></ng-template>
                </div>
                <div class="sl-content" *ngIf="subProcess.tasks?.length">
                    <ng-template [ngTemplateOutlet]="taskTemplateRef"
                                 [ngTemplateOutletContext]="{ taskList: subProcess?.tasks }"></ng-template>
                </div>
            </div>
            <div class="sl-item" *ngIf="subProcess.childItems?.length">
                <ng-template [ngTemplateOutlet]="subProcessTemplateRef"
                             [ngTemplateOutletContext]="{ list: subProcess.childItems }"></ng-template>
                <!--<ng-template [ngTemplateOutlet]="taskTemplateRef"
                             [ngTemplateOutletContext]="{ taskList: data?.tasks }"></ng-template>-->
            </div>
        </ng-template>
    </div>

</ng-template>
<ng-template #taskTemplateRef let-taskList="taskList">
    <div class="streamline streamline-xs streamline-dotted">
        <ng-template ngFor let-task [ngForOf]="taskList | sortBy:'asc': 'sortOrder'" let-i="index">
            <div class="sl-item b-warning">
                <!--<div class="sl-icon"><i class="fa fa-tasks"></i></div>-->
                <div class="sl-content text-xs">
                    <div class="sl-author m-0">
                        <a class="btn btn-xs text-xs b-theme text-theme border-0" (click)="editTask(task)"><i class="fa fa-edit"></i></a>
                        <a [ngbPopover]="content" placement="auto" popoverTitle="Details"
                           container="body" #p="ngbPopover"
                           (mouseenter)="p.open()"  (mouseleave)="p.close()">
                            <i class="fa fa-tasks" [class]="(task.isManual) ? 'text-warning': 'text-success'"></i>
                        </a>
                        <a class="px-1"><i [class]="(task.isStatusOnMailRequired) ? 'fa fa-envelope-o text-success': 'fa fa-envelope'"></i></a>
                        {{task.name}}
                        <a class="text-primary px-2" *ngIf="task.remark" [ngbPopover]="task.remark" placement="auto"
                           (mouseenter)="p.open()" #p="ngbPopover" (mouseleave)="p.close()">
                            <i class="fa fa-info-circle"></i>
                        </a>

                        <ng-template #content>
                            <!--triggers="manual" [autoClose]="true" (click)="p.toggle()"-->
                            <a [class]="(task.isManual) ? 'text-warning': 'text-success'">{{(task.isManual) ? 'Manual': 'Automatic'}}</a>
                            {{task.taskPriorityName || '--'}} Priority  <a class="text-primary">{{task.frequencyTypeName || '--'}} </a> Task

                            <ng-template [ngTemplateOutlet]="taskActionsTemplateRef"
                                         [ngTemplateOutletContext]="{ data: task }"></ng-template>
                            <!--<div class="max-width: 500px;">
                                <scheduler-info [id]="id" [taskId]="orgTaskId"></scheduler-info>
                                <loader [isLoading]="submitted"></loader>
                            </div>-->
                        </ng-template>
                    </div>
                    <!--<p>This
                        <a class="text-primary">{{ (task.isManual) ? 'Manual': 'Automatic'}}</a>
                        <small *ngIf="task.isPrimary" class="item-title _500 text-success px-1">(High Priority)</small>
                        Task executed <a class="text-info">{{task.lastRunResult}}</a> on <a class="text-info">{{task.lastRunTime}}</a>.
                        &lt;!&ndash;Next execution date is {{task.nextRunTime }}.&ndash;&gt;
                        <span class="float-right" *ngIf="task.isVerificationRequired">Verification Required</span>
                    </p>-->

                </div>
            </div>
        </ng-template>
    </div>
</ng-template>

<ng-template #taskActionsTemplateRef let-data="data">
    <div class="float-right">
        <ul class="nav nav-xs no-border">
            <li class="nav-item text-xs" *ngIf="data.isStatusOnMailRequired">
                <div class="float-right text-sm-right">
                    <div class="float-left"><i class="fa fa-envelope-o text-success"></i></div>
                    <div class="float-left mx-1" *ngIf="data.isStatusOnMailDaily"><i class="fa fa-check"></i> Daily
                    </div>
                    <div class="float-left mx-1" *ngIf="data.isStatusOnMailWeekly"><i class="fa fa-check"></i> Weekly
                    </div>
                    <div class="float-left mx-1" *ngIf="data.isStatusOnMailMonthly"><i class="fa fa-check"></i> Monthly
                    </div>
                </div>
            </li>
        </ul>
    </div>
</ng-template>
